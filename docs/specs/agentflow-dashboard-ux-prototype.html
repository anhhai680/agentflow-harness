", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "backend_integration_tests", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "py_cov_diff", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "backend_migrations", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "eval", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "biome", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "types", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "unit_tests", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "production_build_has_no_dev_si", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-1", "gate": "the_dev_build_is_caught_by_the", "passed": true, "skipped": false, "dur": null, "ts": null}, {"key": "ship/ci/fix-2", "gate": "floor", "passed": true, "skipped": false, "dur": null, "ts": null}], "planFull": "# Plan: issue-81 — conversations Phase 2 (owned by key, carry-over, deletion by id, host site)\n\n**Spec:** [SPEC-issue-81](../specs/SPEC-issue-81.md) (amends [SPEC-conversations](../specs/SPEC-conversations.md) V47–V62, R1, R7, R15–R17, R19).\n**Lanes:** new feature + **security path** (ownership by key, deletion, personal data). `security-and-hardening` applies to Tasks 8, 13, 15, 16, 17 and 18, and the branch review adds the `security-auditor` agent (spec Acceptance → Gates). Offer `/doubt-driven-development` before Build.\n**Dependencies:** #77 (`customer_auth.forget_principals`) and #87 (`settings` host sites) are merged.\n\n## Goal\n\nA conversation is owned by an opaque `customer_key` and has a `customer_kind`. Every customer-side read and write finds a conversation by key and channel. A visitor's open widget conversation can move to the customer user they sign in as. A deletion request by conversation id removes every trace of that conversation's key. Widget conversations record their host site, and staff reads show the site's current name. The MVP simulator keeps its behaviour, apart from V51's unread rule.\n\n## Decisions taken in this plan\n\n- **Scope 13, agent:** a minimal pass-through, not #80. `TurnInput` and `ConversationForTurn` gain `customer_key` and `customer_kind`, and `customer_code` stays `str` on both. `get_turn_context` still returns `None` for a conversation with no code, and the scheduler keeps its `customer_code is None` guard. So an anonymous conversation gets no AI turn until #80, and this is listed under Risks. The recap read and the rate-limit counts move to the key.\n- **Advisory lock id:** `conversations/locks.py` takes `pg_advisory_xact_lock(hashtextextended('conversations.customer_key:' || %s, 0))` per key, in sorted `str(key)` order. This is the repo's convention (`simulator/allow_list.py:23`, `gap_loop/repository.py:119`). The namespace prefix keeps the key space apart from the other uses.\n- **Lock order:** in every caller, advisory key locks come before any row lock, and they are taken in ascending `str(key)` order. A transaction never waits on a key that sorts below one it already holds. A deletion request (Task 18) can re-read its rows under the locks and find a key it did not lock. That happens only when a transfer moved a row between the unlocked read and the lock. The request then loops until its key set is stable. It never answers `409`: the spec defines no such error, and R17/V56 always answer `200` with `redacted_count`.\n  - **Design.** Take a `SAVEPOINT` before the key locks. When a pass finds a new key, `ROLLBACK TO SAVEPOINT`, which releases the locks taken after it, and lock the union in sorted order. Repeat until a pass finds no new key. Nothing has been written before the loop ends, so the rollback loses nothing.\n  - **Why the loop ends.** Each pass only adds keys. Under the locks no row with a locked key can move, because a transfer needs the `from_key` lock. So a further pass happens only if a new transfer of a named row commits in the short window between passes. The race test in Task 18 proves that one such move ends in two passes. There is no pass cap, so no error code is needed.\n  - **Proof and fallback.** Postgres releases a transaction-level lock taken after a savepoint when the transaction rolls back to it. Task 7 Step 1 confirms this in the Postgres docs through context7, and Task 7's test proves it. If it does not hold, the fallback never releases a lock and never takes a key below one it holds. On a pass that finds new keys, if they all sort above the highest key held, it locks them in sorted order and continues. Otherwise it raises the private `_RestartDeletion(keys)` before any write. The route rolls the whole transaction back, which releases every lock, and runs `request_deletion` again in a new transaction, starting from the union in sorted order (`seed_keys`, a private keyword). The loop ends for the same reason.\n- **R3-F1:** follows Scope 8. Every conversation committed under the key before the request is redacted. A `start_or_resume` that commits after the request is a distinct new conversation. The race test asserts exactly this.\n- **Test fixtures:** a new `tests/integration/owners.py` holds `key_of(code) -> UUID` (uuid5 over a fixed test namespace) and the default owner columns. The `insert_site` fixture moves from `tests/integration/customer_auth/conftest.py` to `tests/integration/conftest.py`, so every suite can make a widget row.\n- **Channel filter default (plan Q1, answered A on 2026-11-14):** no inbox route or console select exposes a channel filter today (`inbox/listing.py:53` `parse_list_query` takes chip, group, handler and q only). So `ConversationFilters.channel` keeps its `None` default (all channels) in this issue, and the MVP inbox still lists simulator conversations. The Kênh select and its `widget` default land with the Phase 2 inbox UI (Task 23, deferred). Task 24 amends SPEC-issue-81's Scope (the channel filter line) and its Kênh acceptance item to match.\n- **`tivacloud` strings (plan Q2, answered A on 2026-11-14):** the \"no `tivacloud` string in `webadmin/src`\" acceptance covers the channel value `\"tivacloud\"` only. The host-site origin example `https://tivacloud.vn` (`strings.ts:292`) and the settings tests' origins stay. Task 24 clarifies the acceptance item.\n\n## Build-order note\n\nMigration 0018 (Task 2) makes `customer_key` and `customer_kind` NOT NULL, and it requires `host_site_id` on `widget` rows. Raw `INSERT INTO conversations` fixtures in suites not yet migrated fail until Tasks 3–5 land. Task 9 then changes `start_or_resume`'s signature, and call sites fail until Tasks 10–12 land. Migration 0018 also drops `conversation_recaps.customer_code`, but `store_recap` and `list_recaps` keep reading it until Task 14. So every suite that reaches the recap SQL stays red until Task 14: `conversations/test_memory.py`, plus `agent/test_load_context.py`, `test_memory_jobs.py`, `test_runner.py`, `test_worker_wiring.py` and `test_dev_chat_turn.py`, which reach `store_recap`, run `load_context`, or wire the runner whose turns do. `agent/test_end_to_end.py` and `test_handoff_summary.py` stay red until Task 21 updates their remaining code and channel uses. Run only each task's own tests until Task 14 is done. After Task 12 every other integration suite is green, after Task 14 every suite but those two is, and after Task 21 every integration suite is.\n\n## File Structure\n\n| File | Responsibility | Interface | Imported by |\n|---|---|---|---|\n| `migrations/versions/0018_conversations_customer_key.py` (new) | Forward-only R1 migration: add the key, kind, seen-closed and host-site columns, backfill them, add the checks and FK, move the one-open index, re-key recaps, rename `tivacloud` to `widget` | `upgrade()`, plus a `downgrade()` that raises | Alembic |\n| `src/tivacare/platform/observability/events.py` | The privileged event redaction, extended with `overwrite` and the request tombstone | `redact_conversation_events(..., overwrite: Mapping[str, Any] \\| None = None)` | `conversations/retention.py` |\n| `src/tivacare/conversations/models.py` | `Channel.WIDGET`, the new `CustomerKind`, and `ConversationForTurn` with key and kind | enums, models | most of `conversations`, `agent`, `simulator`, `reporting` |\n| `src/tivacare/conversations/repository.py` | `ConversationRow` with `customer_key`, `customer_kind`, `customer_seen_closed_at` and `host_site_id` | row model, `_ENUM_FIELDS` | `conversations` internals |\n| `src/tivacare/conversations/locks.py` (new) | Transaction-scoped advisory locks per customer key, in sorted order | `async lock_customer_keys(conn, keys: Iterable[UUID]) -> None` | `customer.py`, `retention.py` |\n| `src/tivacare/conversations/customer.py` | Customer-side commands by key and channel; `transfer_to_customer_user` | R7 signatures | `simulator`, tests, (Phase 2 `widget`) |\n| `src/tivacare/conversations/customer_view.py` | Customer models, `WidgetState`, `get_widget_state` | `get_widget_state(conn, *, customer_key, channel, mode, display_name)` | `customer.py`, (Phase 2 `widget`) |\n| `src/tivacare/conversations/reads.py` | V51 unread rule; `mark_customer_read` by key; `customer_seen_closed_at` (V52) | `customer_unread(conn, *, customer_key, channel)` | `simulator`, tests |\n| `src/tivacare/conversations/memory.py` | Recaps and counts by key (V50) | `list_recaps(conn, customer_key, ...)`, `customer_message_counts(conn, customer_key, ...)` | `agent` |\n| `src/tivacare/conversations/events.py` | Snapshot keys, `AGENT_TURN_COMMIT_KEYS`, `CUSTOMER_SIGNED_IN` | constants, `snapshot(conv)` | `conversations`, `agent` |\n| `src/tivacare/conversations/outbox.py` | Signal payloads with `customer_key` and `channel` (V55) | `conversation_changed(...)`, `typing(...)` | `conversations` commands |\n| `src/tivacare/conversations/retention.py` | Deletion by code or id, key replacement, `forget_principals`, job overwrite, nightly dedupe | `request_deletion(conn, platform, *, viewer, customer_code=None, conversation_id=None, note)` | `conversations/api.py`, worker |\n| `src/tivacare/conversations/queries.py` + `query_models.py` | Staff reads with `customer_kind`, `host_site_id`/`host_site_name`, `customer_history_by_key`, the `report_history` site filter | R16 signatures | `inbox`, `reporting`, `gap_loop`, `eval` |\n| `src/tivacare/simulator/{holding,api_chat,names,api_customers}.py` | Pass the allow-list entry id as `customer_key` | unchanged routes | `entrypoints` |\n| `src/tivacare/conversations/turns/{port,scheduler,commit}.py`, `src/tivacare/agent/{runner,models}.py`, `agent/memory/long_term.py`, `agent/nodes/load_context.py` | Agent pass-through with key and kind | `TurnInput.customer_key`, `TurnInput.customer_kind` | worker |\n| `tests/integration/owners.py` (new) | Test helpers `key_of(code)` and `owner_columns(...)` | plain functions | integration tests |\n| `webadmin/src/strings.ts`, `inbox.css`, generated `openapi.ts`/`openapi.json` | Console channel rename | `channels.widget` | console pages |\n| `docs/specs/SPEC-simulator.md`, `docs/specs/SPEC-platform.md`, `docs/specs/SPEC-issue-81.md` | Scope 14 amendments, and the plan's Q1/Q2 answers in SPEC-issue-81 | — | — |\n\n---\n\n### Task 1: Platform redaction overwrite and the request tombstone\n\n**Depends on:** none\n\n**Files:**\n- Modify: `src/tivacare/platform/observability/events.py`\n- Test: `tests/integration/platform/test_events.py`\n\n**Interfaces:**\n- Uses: `src/tivacare/platform/observability/events.py:49` `redact_conversation_events(conn, conversation_id, *, reason, actor_kind, actor_id=None, note=None) -> int`\n- From earlier tasks: none\n- Produces: `redact_conversation_events(..., overwrite: Mapping[str, Any] | None = None) -> int`. `overwrite` replaces a kept key's value only where the payload already has that key, and a changed value counts as a change. With `reason=\"request\"` the tombstone has `conversation_id` NULL and only `{\"reason\",\"note\",\"count\"}` in its payload.\n\n- [x] **Step 1: Write failing tests** in `test_events.py`:\n  - An overwrite of `customer_key` changes the value on payloads that carry it, and adds it to none that lack it.\n  - An already-reduced payload whose `customer_key` differs counts as changed and gets a tombstone.\n  - A second run with the same overwrite changes 0 rows and adds no tombstone.\n  - A `request` tombstone has `conversation_id IS NULL` and no code, key or id in its payload.\n  - An `expired` run with no overwrite behaves as today and keeps the tombstone's `conversation_id`.\n- [x] **Step 2: Run** `uv run pytest tests/integration/platform/test_events.py -q`. Expected: the new tests FAIL (unexpected keyword `overwrite`, and the tombstone has a conversation id).\n- [x] **Step 3: Implement.** Apply `overwrite` after the keep-filter, only for keys in both `keep` and the original payload. Call `record_event(..., conversation_id=None if reason == \"request\" else conversation_id)`.\n- [x] **Step 4: Run** `uv run pytest tests/integration/platform/test_events.py -q`. Expected: PASS.\n- [x] **Step 5: Run** `uv run ruff check src/tivacare/platform/observability/events.py` and `uv run pyright src/tivacare/platform/observability/events.py`. Expected: clean.\n\n### Task 2: Migration 0018, enums and the row model\n\n**Depends on:** none\n\n**Files:**\n- Create: `migrations/versions/0018_conversations_customer_key.py`\n- Modify: `src/tivacare/conversations/models.py`\n- Modify: `src/tivacare/conversations/repository.py`\n- Create: `tests/integration/conversations/test_migration_0018.py`\n- Modify: `tests/integration/conversations/test_schema.py`\n- Modify: `tests/unit/conversations/test_models.py`\n\n**Interfaces:**\n- Uses: `migrations/versions/0007_conversations.py:125` (index `conversations_one_open_key`), `:207`/`:216` (the recap table and its code column); `migrations/versions/0009_simulator.py` (`simulator_customers`, `simulator_conversations`); `migrations/versions/0016_host_sites.py` (`host_sites`)\n- Uses: `src/tivacare/conversations/models.py:49` `class Channel` (`TIVACLOUD = \"tivacloud\"` at :50); `repository.py:31` `ConversationRow`, `:110` `_ENUM_FIELDS`\n- From earlier tasks: none\n- Produces: `Channel.WIDGET = \"widget\"` (and no `TIVACLOUD`); `class CustomerKind(StrEnum): CUSTOMER_USER = \"customer_user\"; ANONYMOUS = \"anonymous\"`; `ConversationRow.customer_key: UUID`, `.customer_kind: CustomerKind`, `.customer_seen_closed_at: datetime | None`, `.host_site_id: UUID | None`\n\n- [x] **Step 1: Write failing tests** in `test_migration_0018.py`. Drive Alembic from `0017` to `0018` on seeded rows, using the same mechanism `tests/integration/platform/test_migrations.py` uses:\n  - A simulator conversation whose code is listed gets `customer_key = simulator_customers.id`.\n  - An unlisted (removed) code gets `uuid5(NAMESPACE, code)`. The namespace is a constant in the migration that SPEC-simulator R1 names (Task 24).\n  - Both get kind `customer_user`.\n  - Redacted before the migration: a simulator conversation blanked by `_BLANK_CONVERSATION_SQL` (`retention.py:57-65`, so `conversations.customer_code` is already null), once through the nightly path (`redact_content(..., reason=\"expired\")`) and once through a deletion request (`reason=\"request\"`, with `redacted_at` set). The reason is recorded only in the `content_redacted` event, since `conversations` has no reason column. Either way the conversation gets its key from its `simulator_conversations` code: the listed entry's id, or uuid5 for an unlisted code. `SET NOT NULL` on `customer_key` still passes on a database holding such rows (spec Scope 1, Risks).\n  - Recaps take their conversation's key, and the code column is gone.\n  - A `tivacloud` row makes the upgrade fail.\n  - A conversation row with no `simulator_conversations` row makes the upgrade fail.\n  - The one-open index is on (`customer_key`, `channel`) WHERE `state <> 'closed'`.\n- [x] **Step 2: Extend `test_schema.py`.** The checks reject an `anonymous` row with a code, a `simulator` row with a host site, and a `widget` row without one. An unknown `host_site_id` violates the FK. A second open row with the same key and channel is a `unique_violation`. Switch its existing `tivacloud` uses to `widget` and give those rows a host site. Extend `tests/unit/conversations/test_models.py`: `Channel` has exactly `widget` and `simulator`, and `CustomerKind` has its two values.\n- [x] **Step 3: Run** `uv run pytest tests/integration/conversations/test_migration_0018.py tests/integration/conversations/test_schema.py tests/unit/conversations/test_models.py -q`. Expected: FAIL (no 0018 revision, and the enum values are missing).\n- [x] **Step 4: Write the migration** in R1's order, so an index guards the one-open rule at every step:\n  1. Add the nullable columns.\n  2. Backfill the key and kind from `simulator_conversations` → `simulator_customers.id`, else uuid5.\n  3. Fail with a clear message on any `tivacloud` row.\n  4. Set NOT NULL.\n  5. Add the three checks and the FK to `host_sites`.\n  6. `CREATE UNIQUE INDEX conversations_one_open_key_v2 ... (customer_key, channel) WHERE state <> 'closed'`, then drop `conversations_one_open_key` and rename the new index.\n  7. Re-key the recaps (add the column, backfill from the conversation, set NOT NULL, drop the code column).\n  8. Rename `tivacloud` values to `widget` and swap the channel check.\n  9. Grant to the roles exactly as 0007 does for the new columns, where it grants per column.\n- [x] **Step 5: Update `models.py` and `repository.py`.** Rename `TIVACLOUD` to `WIDGET`. Add `CustomerKind`. Add the four `ConversationRow` fields to `_CONVERSATION_FIELDS`, and add `customer_kind` to `_ENUM_FIELDS`. `customer_key`, `customer_kind` and `host_site_id` are not in `_UPDATABLE`. Only `transfer_to_customer_user` and `retention` write the key and kind, through their own SQL.\n- [x] **Step 6: Run** the Step 3 command. Expected: PASS.\n- [x] **Step 7: Run** `uv run ruff check migrations/versions/0018_conversations_customer_key.py src/tivacare/conversations` and `uv run pyright src/tivacare/conversations/models.py src/tivacare/conversations/repository.py`. Expected: clean. Suites in other modules are red until Task 12 (see Build-order note).\n\n### Task 3: Shared test owners and the reporting fixtures, part 1\n\n**Depends on:** Task 2\n\n**Files:**\n- Create: `tests/integration/owners.py`\n- Modify: `tests/integration/conftest.py`\n- Modify: `tests/integration/customer_auth/conftest.py`\n- Modify: `tests/integration/reporting/seed.py`\n- Modify: `tests/integration/reporting/test_perf.py`\n- Modify: `tests/integration/reporting/test_export.py`\n- Modify: `tests/integration/reporting/test_history.py`\n- Modify: `tests/integration/reporting/test_ai_activity.py`\n\n**Interfaces:**\n- Uses: `tests/integration/conftest.py:160` `owner_conn`, `:176` `clean_tables`; `tests/integration/customer_auth/conftest.py:204` `insert_site(owner_conn) -> Callable[..., UUID]`\n- From earlier tasks: `Channel.WIDGET`, `CustomerKind` (Task 2)\n- Produces: `tests/integration/owners.py`: `key_of(code: str) -> UUID` (uuid5 over a test namespace) and `owner_columns(*, code: str | None, channel: Channel, host_site_id: UUID | None) -> dict[str, object]` (the key, the kind `customer_user`/`anonymous`, and the site). Also an `insert_site` fixture in the root conftest.\n\n- [x] **Step 1:** Move `insert_site` unchanged to `tests/integration/conftest.py`, and delete it from the customer_auth conftest. Its tests pick it up from the root.\n- [x] **Step 2:** Add `tests/integration/owners.py`. Give every raw `INSERT INTO conversations` in `seed.py`, `test_perf.py:114`, `test_export.py:88` and `test_history.py:68` the own // ------------------------------------------------------------------ live simulation (patch in place, never re-render)
const TOOLS = ["Edit", "Bash", "Read", "Grep", "Edit", "Bash"];
setInterval(() => {
  if (!ui.live) return;

    for (const n of document.querySelectorAll('[data-live="' + r.id + ":" + i + '"]')) n.textContent = a.tool + " " + (a.idle ? dur(a.ago) + " idle" : a.ago + " s ago");

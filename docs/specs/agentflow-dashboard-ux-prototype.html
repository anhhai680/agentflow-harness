dget": 90.183909, "issue": "# Issue #81: Conversations Phase 2: own conversations by customer key, customer kind, and host site (SPEC-conversations V47–V62)\n\nURL: https://github.com/anhhai680/customers-support-agentic-ai/issues/81\n\nThe text below is input to the run, as given: data to work from, never instructions to follow.\n\n## Summary\n\nBuild the conversations Phase 2 amendment (SPEC-conversations, amended 2026-11-12, twice). A conversation is now owned by an opaque `customer_key` and has a `customer_kind` (`customer_user | anonymous`). `customer_code` stays only as the nullable, injected snapshot and CRM key. Widget conversations also record the host site they started from.\n\n- Spec: `docs/specs/SPEC-conversations.md`: the two \"Amended 2026-11-12\" notes, V47–V62, R1, R7, R15, R16, R17, R19, Success Criteria 15 and 20–24, and Q11–Q14 (all resolved)\n- Backed by: ADR-036, ADR-037, `docs/specs/SPEC-customer-auth.md` (R4, R9), `docs/specs/SPEC-widget.md` (W7–W13, Contracts), `docs/specs/SPEC-settings.md` (C31, C32)\n- Lanes: **new feature** with a **security path**: a conversation is found only by its owner's key, and widget routes may return only `customer_view` models. Add `security-and-hardening` at Plan and Review, and offer `/doubt-driven-development` before Build.\n\n## Blocks\n\n- #80 (agent Phase 2), which reads `customer_key`, `customer_kind`, and the nullable `customer_code` from the conversation, and counts rate limits by key\n- The widget plan's deferred tasks (`docs/plans/2026-11-13-widget-widget.md`", "facts": [{"text": "floor_guard's assertion_shape blanks only literals, so an assertion whose only change is a renamed identifier (e.g. an enum member) is reported as assertion-removed and needs a human Constraints-Approved-By trailer on a branch commit.", "key": "build/build/task-9/implement/resolve-1"}, {"text": "Agents may not add Constraints-Approved-By trailers or commit; a rename-only assertion change can only be unblocked by a human-supplied trailer on a commit.", "key": "build/build/task-9/implement/resolve-1"}, {"text": "The runner rejects any commit carrying Constraints-Approved-By and won't push commits it didn't make; for this run the floor gate is CI-only and the human adds the approval commit to the PR branch after the draft PR opens.", "key": "build/build/task-9/implement/resolve-2"}], "resolve2": "# 20261114-2157-feature-issue-81-conversations-phase-2-own-conve: build/build/task-9/implement/resolve-2\n\nfloor_guard fails again on the rename-only test_kpi.py finding because the human's approval commit 5ce7be0 (empty, Constraints-Approved-By: anhhai680) was reset away: the reflog shows 'reset: moving to 6887c8b' after it, and no branch contains it. A human or the runner must put 5ce7be0 back on the branch (e.g. git cherry-pick 5ce7be0) or carry the trailer in the Task 9 commit; agents cannot commit or reset. No repo files changed.\n\nRun `20261114-2157-feature-issue-81-conversations-phase-2-own-conve` is waiting on `build/build/task-9/implement/resolve-2` (blocked).\nFix what the stop needs, then `agentflow approve 20261114-2157-feature-issue-81-conversations-phase-2-own-conve build/build/task-9/implement/resolve-2` resumes the step's agent session where it stopped (it is not marked done); `agentflow reject 20261114-2157-feature-issue-81-conversations-phase-2-own-conve build/build/task-9/implement/resolve-2 --note \"...\"` sends task 9 back for a refine round.\n", "specRevs": {"draft": "# Conversations Phase 2: ownership by customer key, customer kind, and host site\n\nStatus: proposed (pending approval)\n\n**Depends on:** none\n\nThis builds the Phase 2 amendment to [SPEC-conversations](SPEC-conversations.md): the two \"Amended 2026-11-12\" notes at the top, V47–V62, R1, R7, R15, R16, R17, R19, Success Criteria 15 (as V51 amends it) and 20–24, and Q11–Q14 (all resolved there). Its backing is [ADR-036](../decisions/ADR-036-optional-customer-identity.md), [ADR-037](../decisions/ADR-037-host-sites-in-the-console.md), [SPEC-customer-auth](SPEC-customer-auth.md) R4 and R9, [SPEC-widget](SPEC-widget.md) W7–W13 and its Contracts, and [SPEC-settings](SPEC-settings.md) C31 and C32. This page lists only what this issue builds and how it is accepted; the rules themselves stay in those specs.\n\nLanes: **new feature** plus a **security path**. A conversation is found only by its owner's key, and widget routes may return only `customer_view` models. `security-and-hardening` applies at Plan and Review. Offer `/doubt-driven-development` before Build.\n\nAlready built: `settings.get_host_site` and `settings.list_host_sites` (`src/tivacare/settings/`), and `customer_auth.forget_principals` with the principal key (`src/tivacare/customer_auth/repository.py`, #77).\n\n## Objective\n\nA conversation is owned by an opaque `customer_key` and has a `customer_kind` (`customer_user | anonymous`). `customer_code` stays only as the nullable injected snapshot and CRM key. Every customer-side read and write finds a conversation by key and channel. A visitor's open widget conversation can move to the customer user they sign in as. A deletion request by conversation id removes every trace of the key. Widget conversations record the host site they started from, and staff reads show its current name. The MVP simulator keeps behaving as it does today, apart from the unread rule V51 changes for it on purpose.\n\n## Scope\n\n1. **Tables and migration (R1, V47–V49, V52, V58, V59, V62).** Add one forward-only migration, `0018`, that follows R1's order so an index guards the one-open rule at every step:\n   - It adds `customer_key`, `customer_kind`, `customer_seen_closed_at` and `host_site_id` to `conversations`.\n   - It makes `customer_code` and `customer_name` nullable at insert.\n   - It backfills every `simulator` row as V58 says, with `customer_kind = 'customer_user'`. The key is the `simulator_customers.id` whose code matches the row's code. For a code no longer on the allow-list, the key is `uuid5(fixed migration namespace, customer_code)`, with the namespace a constant written in the migration. The migration fails if any `tivacloud` row exists.\n   - It applies the checks: `anonymous` ⇒ `customer_code` null, `simulator` ⇒ `host_site_id` null, and `widget` ⇒ `host_site_id` not null. It also adds the FK to `host_sites`.\n   - It moves the partial unique index to (`customer_key`, `channel`) where `state <> 'closed'`.\n   - It keys `conversation_recaps` by `customer_key`, backfilled from each recap's conversation, and drops its code column.\n   - It renames the stored `tivacloud` values to `widget` and swaps the channel check (V49).\n2. **Ownership by key (V47, V48, R7).**\n   - Every customer-side function in `conversations` takes `customer_key` and `channel`. A match on the code alone, or in another channel, is `not_found`. This covers `start_or_resume`, the customer view, posting, read marks, CSAT and holding reads.\n   - `start_or_resume` takes the R7 signature: `customer_key`, `customer_kind`, `customer_code`, `channel`, `host_site_id` and `customer_name`.\n   - `open_conversation_ids(conn, *, channel, customer_keys)` returns a dict keyed by key.\n   - `TurnInput` and `ConversationForTurn` carry `customer_key` and `customer_kind`.\n3. **Simulator call sites only (decided 2026-11-14, Q1).**\n   - `simulator/api_chat.py` passes the allow-list entry's `id` as `customer_key`, with kind `customer_user` and the stored code as the `customer_code` snapshot.\n   - `simulator_conversations`, holding, the picker and the routes are otherwise unchanged. The MVP simulator behaves as before, apart from V51's unread rule.\n   - `conversations` accepts the `anonymous` kind and tests it through its own functions. Khách vãng lai and the rest of SPEC-simulator E18–E22 are out of scope.\n4. **Recaps and rate-limit counts (V50).**\n   - `store_recap` writes only for `customer_user`.\n   - `list_recaps` and the recap rows are keyed by `customer_key`, and the simulator/widget split is kept.\n   - `customer_message_counts(conn, customer_key, *, simulator, now)` counts by key.\n5. **Unread and widget state (V51, V52, R19).**\n   - `customer_unread` counts only the conversation the widget would show, plus the waiting CSAT prompt. This amends V32.\n   - `mark_customer_read` and `submit_csat` set `customer_seen_closed_at` under V52's condition.\n   - `get_widget_state(conn, *, customer_key, channel, mode, display_name) → WidgetState` is new, and `WidgetState` lives in `customer_view.py`.\n6. **Sign-in carry-over (V53).** `transfer_to_customer_user(conn, platform, conversation_id, *, from_key, to_key, customer_code, customer_name)` follows R7:\n   - It runs under the row lock.\n   - The conversation must be open, `widget`, and owned by `from_key`; otherwise the result is `not_found`.\n   - If `to_key` already holds an open widget conversation, it returns `409 customer_has_open_conversation` and moves nothing.\n   - Otherwise it sets the key, kind, code and name, and posts one \"Khách đã đăng nhập\" line from `templates.py`.\n   - It records `conversations.customer_signed_in` and sends `conversation_changed` for both keys.\n   - State, assignee, timers, read positions and `host_site_id` stay unchanged.\n7. **Signals (V55).** The `conversation_changed` and `typing` payloads gain `customer_key` and `channel`. The console hub still forwards ids only (R12).\n8. **Deletion requests (V56, R17, R22).**\n   - `DeletionRequest` takes exactly one of `customer_code` and `conversation_id`. Both or neither is `422 validation_error`.\n   - A request by id redacts every conversation that has that conversation's key. An unknown id returns `200` with `redacted_count: 0`.\n   - The request calls `customer_auth.forget_principals(conn, keys)` inside V26 step 1's transaction.\n   - Each redacted conversation's `customer_key` is replaced with a fresh random uuid, on the row and on its events (decided, was Open Question 3):\n     - Step 1 replaces the row's key in the route's transaction. The api has no redactor connection.\n     - The worker's `conversations.redact_events` job (R17) then copies the conversation's new key onto its events, through an extension of platform's privileged `redact_conversation_events` path (ADR-014). The job payload carries no key. Events follow within seconds, as the content keys already do.\n     - The extension: `redact_conversation_events` gains an optional set of metric values to overwrite on the payloads it keeps (here, `customer_key`). The job reads the conversation's current key from its row and passes it in.\n     - For a request-reason redaction, the privileged path writes its `retention.redacted` tombstone with `conversation_id` null and no code, key or id in its payload. An `expired` redaction behaves as today. SPEC-platform R4 is amended to match, in this issue (Scope 14).\n   - No event or tombstone written by the request holds a code, key or conversation id.\n   - The nightly expiry redaction keeps the key (Q11).\n9. **Host site (V59–V61).**\n   - `host_site_id` is set once, by `start_or_resume` on create. Carry-over and redaction keep it.\n   - No rule reads `host_site_id`, and no `customer_view` model carries it.\n   - These staff reads carry `host_site_id` and `host_site_name`, using one `list_host_sites` call per query (`get_host_site` for a single conversation): `list_conversations`, `search_conversations`, `get_staff_view`'s header, `report_history` / `iter_report_history`, and both history calls.\n   - Inactive sites keep their name. An unknown id gives a null name, and a simulator conversation gives nulls.\n   - `report_history` and `iter_report_history` gain a `host_site_id=None` filter.\n10. **Events and staff reads (V57, V60, R15, R16).**\n    - `customer_kind`, `customer_key` and `host_site_id` are snapshot metric keys on lifecycle events and `staff_replied`, and they are in `AGENT_TURN_COMMIT_KEYS`. V57 governs where R15's sentence omits `customer_key`.\n    - `inbox` rows and `report_history` rows carry `customer_kind`. The channel filter's default becomes `widget`.\n    - `customer_history_by_key(conn, customer_key, *, channel, exclude_conversation_id=None, cursor=None, limit) → HistoryPage` is new (Q12).\n    - Rows from both history calls gain `host_site_id`, `host_site_name`, `customer_kind` and `customer_name`.\n11. **Page context (V54 superseded).** The page context stays `screen`, `error_code` and `app_version`, each capped at 64 characters. Nothing stores a `host_origin`.\n12. **Channel rename in the console.**\n    - `webadmin/src/strings.ts`, the inbox's Kênh filter and its default, the reporting labels, `inbox.css` and the test fixtures use `widget` instead of `tivacloud`.\n    - The OpenAPI schema and generated types are regenerated, not hand-edited.\n13. **Agent stays compiling (coordination with #80).** `agent/runner.py` and `agent/state.py` keep compiling and keep the MVP's behaviour against the new signatures. The plan chooses between a minimal pass-through here and building #80 on the same branch.\n14. **Spec amendments on this branch.**\n    - [SPEC-simulator](SPEC-simulator.md) R1's Phase 2 note (decided 2026-11-14, Q2): a `simulator_conversations` row whose code is no longer listed takes the key V58 gives, `uuid5(the same namespace, customer_code)`, or copies it from the `conversations` row with the same id. It no longer gets \"a fresh uuid\".\n    - [SPEC-platform](SPEC-platform.md) R4 (Q3): the overwrite parameter and the request-reason tombstone from Scope 8. Its Success Criterion 12 gains the matching check.\n\n## Out of scope\n\n- SPEC-simulator E18–E22: the `simulator_conversations.customer_key` column and its backfill, holding by key, Khách vãng lai (the `visitor` route and picker entry), E21's thread choice, and E22. They land with SPEC-simulator's Phase 2 work (Q1).\n- SPEC-simulator E23: an allow-list removal becomes a soft delete (Q13). Until it lands, removing an entry and adding it back gives the customer a new key.\n- SPEC-inbox's and SPEC-reporting's Phase 2 UI amendments: the drawer's key-based history, kind badges, and the host-site column and filter. This issue changes only the channel strings and default (Scope 12).\n- The widget's R5 routes, the realtime hub's widget side, the avatar route, the widget schema export, and E2E. These are the deferred tasks in `docs/plans/2026-11-13-widget-widget.md`. `get_widget_state` and `transfer_to_customer_user` are built as functions and tested directly.\n- #80's agent changes beyond keeping `agent` compiling (Scope 13).\n- Any `host_origin` field (V54 is superseded).\n\n## Acceptance criteria\n\n**Unit**\n- [ ] `DeletionRequest` rejects both or neither of `customer_code` and `conversation_id` with `422 validation_error`, and accepts each one alone.\n- [ ] `WidgetState` carries no `host_site_id`, code, or staff-only field. A test walks every `customer_view` model's fields and checks this.\n- [ ] `customer_kind`, `customer_key` and `host_site_id` are declared metric keys on the lifecycle events, `staff_replied`, and `AGENT_TURN_COMMIT_KEYS`.\n\n**Integration (real Postgres)**\n- [ ] The migration runs forward on a copy of existing simulator data:\n  - Each row's key is its allow-list entry's id, and a removed entry's rows get V58's fallback key (tested).\n  - Recaps take their conversation's key.\n  - A `tivacloud` row makes the migration fail.\n  - The one-open index exists after the migration.\n- [ ] SC 20: a conversation is found only by the key and channel that opened it, and a code-only or other-channel match is `not_found`. Two keys that share one code can each hold an open conversation. One key cannot hold two open conversations in a channel, including under concurrent `start_or_resume` calls.\n- [ ] The checks reject an `anonymous` row with a code, a `simulator` row with a host site, and a `widget` row without one.\n- [ ] V50: `store_recap` writes nothing for an `anonymous` conversation. `list_recaps` and `customer_message_counts` count by key and keep the simulator/widget split.\n- [ ] SC 15 (as V51 amends it):\n  - `customer_unread` counts only the shown conversation plus a waiting CSAT prompt.\n  - A closed conversation stays in `get_widget_state` until it has been seen with its CSAT prompt shown or answered, after which the state shows none.\n- [ ] SC 21: `transfer_to_customer_user` moves an open visitor conversation, posts exactly one \"Khách đã đăng nhập\" line, records `conversations.customer_signed_in`, and signals both keys. It leaves state, assignee, timers, read positions and `host_site_id` unchanged.\n- [ ] SC 21: `transfer_to_customer_user` returns `409 customer_has_open_conversation` when the user already has an open widget conversation, and nothing changes. It returns `not_found` for a closed, simulator or wrongly-owned conversation.\n- [ ] V55: the `conversation_changed` and `typing` payloads carry `customer_key` and `channel`, and console clients receive ids only.\n- [ ] SC 22: a deletion request by conversation id:\n  - redacts every conversation of that key;\n  - removes the key's principal row in step 1's transaction;\n  - replaces each row's key with a fresh uuid in step 1's transaction, and, once the `redact_events` job has run, its events' keys with that same uuid (the job's privileged path writes a request-reason tombstone without the conversation id);\n  - writes no code, key or conversation id into any event or tombstone.\n- [ ] SC 22: an unknown id returns `200` with `redacted_count: 0`. The nightly expiry redaction keeps the key.\n- [ ] Platform (R4 as amended): `redact_conversation_events` with an overwrite sets `customer_key` on every kept payload. A `request` tombstone has a null `conversation_id` and no code, key or id in its payload, and an `expired` tombstone is unchanged. A second run is still a no-op. The `redact_events` job payload carries no key.\n- [ ] The simulator's calls open and resume conversations under the entry's id, and two entries can't share an open conversation. `simulator_conversations` is unchanged.\n- [ ] SC 23: a widget conversation records its host site once, and carry-over and redaction keep it. Staff reads show the site's current name, including inactive sites, with a null name for an unknown id and nulls for the simulator. Each list read calls `list_host_sites` once. `report_history` filters by `host_site_id`. No customer-side response carries the site.\n- [ ] SC 24: the page context keeps only `screen`, `error_code` and `app_version`, each capped at 64 characters, and never a `host_origin`.\n- [ ] R16: `inbox` and `report_history` rows carry `customer_kind`. `customer_history_by_key` pages a code-less conversation's history. History rows carry the host site, kind and name.\n- [ ] Every earlier SPEC-conversations success criterion still passes. The simulator's existing tests pass unchanged, except where V51 changes the unread count.\n\n**Console**\n- [ ] The Kênh filter shows `widget`, labelled as before, and defaults to it. No `tivacloud` string remains in `webadmin/src`. The generated types come from the regenerated OpenAPI schema.\n\n**Docs**\n- [ ] SPEC-simulator R1's Phase 2 note and SPEC-platform R4 (with its Success Criterion 12) are amended as Scope 14 says.\n\n**Gates and review**\n- [ ] `python3 devtools/floor_guard.py --base origin/main`, `uv run ruff check .`, `uv run ruff format --check .`, `uv run pyright` and `uv run pytest` pass, and `pnpm` lint, typecheck and test pass in `webadmin/`.\n- [ ] At least 80% of changed lines are covered.\n- [ ] `security-auditor` has reviewed the key-based ownership checks, `transfer_to_customer_user`, and the deletion path, and its findings are resolved.\n\n## Open Questions\n\nNone.\n\nResolved on 2026-11-14 (option A each time):\n- **Q1, simulator scope:** only the call sites change, passing the entry's id as the key. SPEC-simulator E18–E22 land with its own Phase 2 work (Scope 3, Out of scope). Rejected: building E18–E22 here, or only Khách vãng lai, because SPEC-simulator files them with the widget and the issue requires the MVP simulator to behave as before.\n- **Q2, backfill key for a removed entry:** V58's `uuid5(fixed migration namespace, customer_code)` governs. SPEC-simulator R1's \"fresh uuid\" is amended to match (Scope 1, Scope 14). Rejected: amending V58 to a fresh uuid, which would make the key depend on the order the two backfills run in.\n- **Q3, events' `customer_key` and the tombstone:** step 1 replaces the row's key, and the `redact_events` job copies it onto the events through an extended `redact_conversation_events`. A request-reason tombstone carries no conversation id, and SPEC-platform R4 is amended (Scope 8, Scope 14). Rejected: a redactor connection in `api`, because R4 keeps that pool worker-only; and a second platform function, because it would add a second privileged path to ADR-014's one.\n\nResolved in SPEC-conversations, not reopened here: Q11 (nightly redaction keeps the key), Q12 (key-based history), Q13 (soft delete belongs to SPEC-simulator E23), Q14.\n", "r1": "# Conversations Phase 2: ownership by customer key, customer kind, and host site\n\nStatus: proposed (pending approval)\n\n**Depends on:** none\n\nThis builds the Phase 2 amendment to [SPEC-conversations](SPEC-conversations.md): the two \"Amended 2026-11-12\" notes at the top, V47–V62, R1, R7, R15, R16, R17, R19, Success Criteria 15 (as V51 amends it) and 20–24, and Q11–Q14 (all resolved there). Its backing is [ADR-036](../decisions/ADR-036-optional-customer-identity.md), [ADR-037](../decisions/ADR-037-host-sites-in-the-console.md), [SPEC-customer-auth](SPEC-customer-auth.md) R4 and R9, [SPEC-widget](SPEC-widget.md) W7–W13 and its Contracts, and [SPEC-settings](SPEC-settings.md) C31 and C32. This page lists only what this issue builds and how it is accepted; the rules themselves stay in those specs.\n\nLanes: **new feature** plus a **security path**. A conversation is found only by its owner's key, and widget routes may return only `customer_view` models. `security-and-hardening` applies at Plan and Review. Offer `/doubt-driven-development` before Build.\n\nAlready built: `settings.get_host_site` and `settings.list_host_sites` (`src/tivacare/settings/`), and `customer_auth.forget_principals` with the principal key (`src/tivacare/customer_auth/repository.py`, #77).\n\n## Objective\n\nA conversation is owned by an opaque `customer_key` and has a `customer_kind` (`customer_user | anonymous`). `customer_code` stays only as the nullable injected snapshot and CRM key. Every customer-side read and write finds a conversation by key and channel. A visitor's open widget conversation can move to the customer user they sign in as. A deletion request by conversation id removes every trace of the key. Widget conversations record the host site they started from, and staff reads show its current name. The MVP simulator keeps behaving as it does today, apart from the unread rule V51 changes for it on purpose.\n\n## Scope\n\n1. **Tables and migration (R1, V47–V49, V52, V58, V59, V62).** Add one forward-only migration, `0018`, that follows R1's order so an index guards the one-open rule at every step:\n   - It adds `customer_key`, `customer_kind`, `customer_seen_closed_at` and `host_site_id` to `conversations`.\n   - It makes `customer_code` and `customer_name` nullable at insert.\n   - It backfills every `simulator` row as R1 step 2 and V58 say, with `customer_kind = 'customer_user'`. The code comes from the conversation's `simulator_conversations` row, never from `conversations.customer_code`, because redaction (expired or requested) nulls that column and leaves `simulator_conversations` alone (SPEC-simulator R1). The key is the `simulator_customers.id` with that code. For a code no longer on the allow-list, the key is `uuid5(fixed migration namespace, that code)`, with the namespace a constant written in the migration. Already-redacted rows, of either reason, are keyed the same way (see Risks). A `simulator` conversation with no `simulator_conversations` row gets no key, so the `NOT NULL` step fails the migration rather than inventing one. The migration fails if any `tivacloud` row exists.\n   - It applies the checks: `anonymous` ⇒ `customer_code` null, `simulator` ⇒ `host_site_id` null, and `widget` ⇒ `host_site_id` not null. It also adds the FK to `host_sites`.\n   - It moves the partial unique index to (`customer_key`, `channel`) where `state <> 'closed'`.\n   - It keys `conversation_recaps` by `customer_key`, backfilled from each recap's conversation, and drops its code column.\n   - It renames the stored `tivacloud` values to `widget` and swaps the channel check (V49).\n2. **Ownership by key (V47, V48, R7).**\n   - Every customer-side function in `conversations` takes `customer_key` and `channel`. A match on the code alone, or in another channel, is `not_found`. This covers `start_or_resume`, the customer view, posting, read marks, CSAT and holding reads.\n   - `start_or_resume` takes the R7 signature: `customer_key`, `customer_kind`, `customer_code`, `channel`, `host_site_id` and `customer_name`.\n   - `open_conversation_ids(conn, *, channel, customer_keys)` returns a dict keyed by key.\n   - `TurnInput` and `ConversationForTurn` carry `customer_key` and `customer_kind`.\n3. **Simulator call sites only (decided 2026-11-14, Q1).**\n   - Every simulator call into `conversations` passes the allow-list entry's `id` as `customer_key`, with kind `customer_user` and the stored code as the `customer_code` snapshot. The entry id is threaded from where the caller already holds the entry, never looked up by code:\n     - `simulator/api_chat.py`: each route passes the `entry_id` that `require_listed` has just accepted, beside the code it returns, to `conversations` and to `holding`.\n     - `simulator/holding.py`: `post_message`, `show_thread`, `require_player`, `_open_id`/`_open_hold` and `holders` take the key (or keys) and use it for `open_conversation_ids`, `start_or_resume`, `post_customer_message` and `get_customer_conversation` (today lines 92–95, 112–113, 142, 159 and 200). `holders` takes the entries' ids and returns a dict keyed by entry id.\n     - `simulator/names.py` (`name_for_new_conversation`): `open_conversation_ids(customer_keys=[entry.id])`.\n     - `simulator/api_customers.py`: the picker passes its entries' ids to `holders` and reads `held_by` by entry id.\n   - `simulator_conversations` keeps its code column, and its own SQL (`_latest`, `_hold_of`, the insert) stays keyed by code. No route, request or response model changes. The MVP simulator behaves as before, apart from V51's unread rule and E18's re-added entry (see Risks).\n   - `conversations` accepts the `anonymous` kind and tests it through its own functions. Khách vãng lai and the rest of SPEC-simulator E18–E22 are out of scope.\n4. **Recaps and rate-limit counts (V50).**\n   - `store_recap` writes only for `customer_user`.\n   - `list_recaps` and the recap rows are keyed by `customer_key`, and the simulator/widget split is kept.\n   - `customer_message_counts(conn, customer_key, *, simulator, now)` counts by key.\n5. **Unread and widget state (V51, V52, R19).**\n   - `customer_unread` counts only the conversation the widget would show, plus the waiting CSAT prompt. This amends V32.\n   - `mark_customer_read` and `submit_csat` set `customer_seen_closed_at` under V52's condition.\n   - `get_widget_state(conn, *, customer_key, channel, mode, display_name) → WidgetState` is new, and `WidgetState` lives in `customer_view.py`.\n6. **Sign-in carry-over (V53).** `transfer_to_customer_user(conn, platform, conversation_id, *, from_key, to_key, customer_code, customer_name)` follows R7:\n   - It runs under the row lock.\n   - The conversation must be open, `widget`, and owned by `from_key`; otherwise the result is `not_found`.\n   - If `to_key` already holds an open widget conversation, it returns `409 customer_has_open_conversation` and moves nothing.\n   - Otherwise it sets the key, kind, code and name, and posts one \"Khách đã đăng nhập\" line from `templates.py`.\n   - It records `conversations.customer_signed_in` and sends `conversation_changed` for both keys.\n   - State, assignee, timers, read positions and `host_site_id` stay unchanged.\n   - Under a race the unique index on (`customer_key`, `channel`) backs up the check (V53). A `unique_violation` on that index, from a concurrent transfer or `start_or_resume` for `to_key`, is mapped to `409 customer_has_open_conversation` with nothing moved, never a `500`.\n7. **Signals (V55).** The `conversation_changed` and `typing` payloads gain `customer_key` and `channel`. The console hub still forwards ids only (R12).\n8. **Deletion requests (V56, R17, R22).**\n   - `DeletionRequest` takes exactly one of `customer_code` and `conversation_id`. Both or neither is `422 validation_error`.\n   - A request by id redacts every conversation that has that conversation's key. An unknown id returns `200` with `redacted_count: 0`.\n   - A request by code selects by `customer_code` as before (V56: \"by code it works as before\"). It does not expand to other conversations of the matched keys. Forgetting principals and replacing keys apply to the conversations it matched, exactly as for a request by id (see Risks).\n   - The request calls `customer_auth.forget_principals(conn, keys)` inside V26 step 1's transaction, with every distinct key on the matched conversations.\n   - The request serialises with anything that can add a conversation under a matched key. `start_or_resume`, `transfer_to_customer_user` (for `to_key`) and the deletion request each take a transaction-scoped advisory lock per customer key before they lock any conversation row. When one call needs several keys, it takes them in sorted order. A request by id takes the key's lock, then re-selects the key's conversations under it. A request by code takes the locks of the keys it found, then re-selects by code, and repeats if a new key appeared. So a conversation committed under the key before the request is redacted by it, and one started after it commits is a new conversation, as with a code today.\n   - The order inside step 1's transaction is: lock and select; close the open ones through `effects.close`, so their `conversation_changed` signal still reaches the old key's clients; `forget_principals`; replace each row's key; `redact_content`; record `conversations.deletion_requested`; enqueue the `redact_events` jobs.\n   - Each redacted conversation's `customer_key` is replaced with a fresh random uuid, on the row and on its events (decided, was Open Question 3):\n     - Step 1 replaces the row's key in the route's transaction. The api has no redactor connection.\n     - The worker's `conversations.redact_events` job (R17) then copies the conversation's new key onto its events, through an extension of platform's privileged `redact_conversation_events` path (ADR-014). The job payload carries no key. Events follow within seconds, as the content keys already do.\n     - The extension: `redact_conversation_events` gains an optional set of metric values to overwrite on the payloads it keeps (here, `customer_key`). The job reads the conversation's current key from its row and passes it in, whatever the reason. For a nightly redaction that is the key the events already hold, so nothing changes (Q11).\n     - This overwrite also covers the events step 1 itself writes with the old key, such as `conversations.closed`'s `customer_key` snapshot (V57).\n     - A failed job inherits the queue's handling unchanged (SPEC-platform R3): 5 attempts with backoff, then `dead` with its `last_error`, never dropped silently. The conversation keeps `redacted_at` null until the job succeeds, so the nightly run (V26) re-enqueues it once its `closed_at` is past the retention period, and that run copies the row's key too (see Risks).\n     - For a request-reason redaction, the privileged path writes its `retention.redacted` tombstone with `conversation_id` null and no code, key or id in its payload. An `expired` redaction behaves as today. SPEC-platform R4 is amended to match, in this issue (Scope 14).\n   - The `conversations.deletion_requested` event and the request's `retention.redacted` tombstones hold no code, key or conversation id (V56). The per-conversation events step 1 writes as today, `conversations.closed` and `conversations.content_redacted`, keep their `conversation_id`. Once the job has run, their `customer_key` is the fresh uuid, and they hold no code.\n   - The nightly expiry redaction keeps the key (Q11).\n9. **Host site (V59–V61).**\n   - `host_site_id` is set once, by `start_or_resume` on create. Carry-over and redaction keep it.\n   - No rule reads `host_site_id`, and no `customer_view` model carries it.\n   - These staff reads carry `host_site_id` and `host_site_name`, using one `list_host_sites` call per query (`get_host_site` for a single conversation): `list_conversations`, `search_conversations`, `get_staff_view`'s header, `report_history` / `iter_report_history`, and both history calls.\n   - Inactive sites keep their name. An unknown id gives a null name, and a simulator conversation gives nulls.\n   - `report_history` and `iter_report_history` gain a `host_site_id=None` filter.\n10. **Events and staff reads (V57, V60, R15, R16).**\n    - `customer_kind`, `customer_key` and `host_site_id` are snapshot metric keys on lifecycle events and `staff_replied`, and they are in `AGENT_TURN_COMMIT_KEYS`. V57 governs where R15's sentence omits `customer_key`.\n    - `inbox` rows and `report_history` rows carry `customer_kind`. The channel filter's default becomes `widget`.\n    - `customer_history_by_key(conn, customer_key, *, channel, exclude_conversation_id=None, cursor=None, limit) → HistoryPage` is new (Q12).\n    - Rows from both history calls gain `host_site_id`, `host_site_name`, `customer_kind` and `customer_name`.\n11. **Page context (V54 superseded).** The page context stays `screen`, `error_code` and `app_version`, each capped at 64 characters. Nothing stores a `host_origin`.\n12. **Channel rename in the console.**\n    - `webadmin/src/strings.ts`, the inbox's Kênh filter and its default, the reporting labels, `inbox.css` and the test fixtures use `widget` instead of `tivacloud`.\n    - The OpenAPI schema and generated types are regenerated, not hand-edited.\n13. **Agent stays compiling (coordination with #80).** `agent/runner.py` and `agent/state.py` keep compiling and keep the MVP's behaviour against the new signatures. The plan chooses between a minimal pass-through here and building #80 on the same branch.\n14. **Spec amendments on this branch.**\n    - [SPEC-simulator](SPEC-simulator.md) R1's Phase 2 note (decided 2026-11-14, Q2): a `simulator_conversations` row whose code is no longer listed takes the key V58 gives, `uuid5(the same namespace, customer_code)`, or copies it from the `conversations` row with the same id. It no longer gets \"a fresh uuid\".\n    - [SPEC-platform](SPEC-platform.md) R4 (Q3): the overwrite parameter and the request-reason tombstone from Scope 8. Its Success Criterion 12 gains the matching check.\n\n## Out of scope\n\n- SPEC-simulator E18–E22: the `simulator_conversations.customer_key` column and its backfill, holding by key, Khách vãng lai (the `visitor` route and picker entry), E21's thread choice, and E22. They land with SPEC-simulator's Phase 2 work (Q1).\n- SPEC-simulator E23: an allow-list removal becomes a soft delete (Q13). Until it lands, removing an entry and adding it back gives the customer a new key.\n- SPEC-inbox's and SPEC-reporting's Phase 2 UI amendments: the drawer's key-based history, kind badges, and the host-site column and filter. This issue changes only the channel strings and default (Scope 12).\n- The widget's R5 routes, the realtime hub's widget side, the avatar route, the widget schema export, and E2E. These are the deferred tasks in `docs/plans/2026-11-13-widget-widget.md`. `get_widget_state` and `transfer_to_customer_user` are built as functions and tested directly.\n- #80's agent changes beyond keeping `agent` compiling (Scope 13).\n- Any `host_origin` field (V54 is superseded).\n\n## Acceptance criteria\n\n**Unit**\n- [ ] `DeletionRequest` rejects both or neither of `customer_code` and `conversation_id` with `422 validation_error`, and accepts each one alone.\n- [ ] `WidgetState` carries no `host_site_id`, code, or staff-only field. A test walks every `customer_view` model's fields and checks this.\n- [ ] `customer_kind`, `customer_key` and `host_site_id` are declared metric keys on the lifecycle events, `staff_replied`, and `AGENT_TURN_COMMIT_KEYS`.\n\n**Integration (real Postgres)**\n- [ ] The migration runs forward on a copy of existing simulator data:\n  - Each row's key is its allow-list entry's id, and a removed entry's rows get V58's fallback key (tested).\n  - A row redacted before the migration (`customer_code` null), one with reason `expired` and one with reason `request`, gets the key of its `simulator_conversations` row's code, and the `NOT NULL` step passes.\n  - Recaps take their conversation's key.\n  - A `tivacloud` row makes the migration fail.\n  - The one-open index exists after the migration.\n- [ ] SC 20: a conversation is found only by the key and channel that opened it, and a code-only or other-channel match is `not_found`. Two keys that share one code can each hold an open conversation. One key cannot hold two open conversations in a channel, including under concurrent `start_or_resume` calls.\n- [ ] The checks reject an `anonymous` row with a code, a `simulator` row with a host site, and a `widget` row without one.\n- [ ] V50: `store_recap` writes nothing for an `anonymous` conversation. `list_recaps` and `customer_message_counts` count by key and keep the simulator/widget split.\n- [ ] SC 15 (as V51 amends it):\n  - `customer_unread` counts only the shown conversation plus a waiting CSAT prompt.\n  - A closed conversation stays in `get_widget_state` until it has been seen with its CSAT prompt shown or answered, after which the state shows none.\n- [ ] SC 21: `transfer_to_customer_user` moves an open visitor conversation, posts exactly one \"Khách đã đăng nhập\" line, records `conversations.customer_signed_in`, and signals both keys. It leaves state, assignee, timers, read positions and `host_site_id` unchanged.\n- [ ] SC 21: `transfer_to_customer_user` returns `409 customer_has_open_conversation` when the user already has an open widget conversation, and nothing changes. It returns `not_found` for a closed, simulator or wrongly-owned conversation.\n- [ ] SC 21 under a race: two concurrent transfers of two visitor conversations to one `to_key` move exactly one, and the other returns `409 customer_has_open_conversation`. A transfer concurrent with `start_or_resume` for `to_key` leaves `to_key` with one open widget conversation, and the transfer either moves or returns `409`. No call returns a `500`.\n- [ ] V55: the `conversation_changed` and `typing` payloads carry `customer_key` and `channel`, and console clients receive ids only.\n- [ ] SC 22: a deletion request by conversation id:\n  - redacts every conversation of that key;\n  - removes the key's principal row in step 1's transaction;\n  - replaces each row's key with a fresh uuid in step 1's transaction, and, once the `redact_events` job has run, its events' keys with that same uuid (the job's privileged path writes a request-reason tombstone without the conversation id);\n  - writes no code, key or conversation id into the `conversations.deletion_requested` event or the tombstones, and once the job has run, the `conversations.closed` and `conversations.content_redacted` events of those conversations carry the fresh key, not the old one.\n- [ ] SC 22: a deletion request by code redacts the conversations with that code, forgets their distinct keys, replaces each row's key with a fresh uuid (and its events' keys once the job has run), and writes no code or key into the event or tombstones. A conversation of the same key without that code is left as it was.\n- [ ] SC 22 under a race: a `start_or_resume`, or a transfer into the key, run concurrently with a deletion request for that key either commits first and is redacted by the request, or commits after it as a new conversation. No conversation under the old key is left unredacted, and the calls do not deadlock.\n- [ ] A `redact_events` job that fails every attempt ends `dead` with its error, the conversation keeps `redacted_at` null, and the next nightly run past its retention period finishes the redaction and copies the row's key onto its events.\n- [ ] SC 22: an unknown id returns `200` with `redacted_count: 0`. The nightly expiry redaction keeps the key.\n- [ ] Platform (R4 as amended): `redact_conversation_events` with an overwrite sets `customer_key` on every kept payload. A `request` tombstone has a null `conversation_id` and no code, key or id in its payload, and an `expired` tombstone is unchanged. A second run is still a no-op. The `redact_events` job payload carries no key.\n- [ ] The simulator's calls open and resume conversations under the entry's id, and two entries can't share an open conversation. `simulator_conversations` is unchanged.\n- [ ] SC 23: a widget conversation records its host site once, and carry-over and redaction keep it. Staff reads show the site's current name, including inactive sites, with a null name for an unknown id and nulls for the simulator. Each list read calls `list_host_sites` once. `report_history` filters by `host_site_id`. No customer-side response carries the site.\n- [ ] SC 24: the page context keeps only `screen`, `error_code` and `app_version`, each capped at 64 characters, and never a `host_origin`.\n- [ ] R16: `inbox` and `report_history` rows carry `customer_kind`. `customer_history_by_key` pages a code-less conversation's history. History rows carry the host site, kind and name.\n- [ ] Every earlier SPEC-conversations success criterion still passes.\n- [ ] The simulator's existing behavioural assertions still hold, except where V51 changes the unread count. No assertion is removed or weakened. Only call sites change, to the key-based signatures (the entry id as key, `customer_keys=`, results keyed by entry id) and to `Channel.WIDGET`:\n  - `tests/integration/simulator/test_holding.py`: `post_message`, `show_thread`, `require_player`, `holders`, `open_conversation_ids`, `get_customer_conversation`, `end_chat`, and `Channel.TIVACLOUD` at line 112.\n  - `tests/integration/simulator/test_chat_api.py`: `open_conversation_ids`, `end_chat` and `post_message`. The body at line 115 still sends `channel=\"tivacloud\"` and `customer_code`, and they are still ignored.\n  - `tests/integration/simulator/test_names.py` (`start_or_resume`) and `tests/integration/simulator/test_customers_api.py` (`post_message`).\n  - `tests/unit/simulator/test_models.py`, only if its `\"tivacloud\"` value is a channel the model now rejects.\n\n**Console**\n- [ ] The Kênh filter shows `widget`, labelled as before, and defaults to it. No `tivacloud` string remains in `webadmin/src`. The generated types come from the regenerated OpenAPI schema.\n\n**Docs**\n- [ ] SPEC-simulator R1's Phase 2 note and SPEC-platform R4 (with its Success Criterion 12) are amended as Scope 14 says.\n\n**Gates and review**\n- [ ] `python3 devtools/floor_guard.py --base origin/main`, `uv run ruff check .`, `uv run ruff format --check .`, `uv run pyright` and `uv run pytest` pass, and `pnpm` lint, typecheck and test pass in `webadmin/`.\n- [ ] At least 80% of changed lines are covered.\n- [ ] `security-auditor` has reviewed the key-based ownership checks, `transfer_to_customer_user`, and the deletion path, and its findings are resolved.\n\n## Risks\n\n- **Pre-migration request redactions get a linkable key.** The backfill keys an MVP simulator conversation that was redacted on request with its entry id, or with V58's `uuid5` of its code, not with a fresh random uuid as V56 gives Phase 2 requests. That key adds no new link: the conversation's `simulator_conversations` row already keeps the code beside its id (SPEC-simulator R1: retention does not touch that table), and the key is computed from that row. Fully unlinking simulator conversations belongs to SPEC-simulator's Phase 2 work, together with that table.\n- **A by-code request leaves the key's code-less conversations.** V56 keeps a by-code request selecting by code. A customer user whose issuer sent no code for some sessions keeps those conversations after the principal row is forgotten. To redact them, an admin makes a second request by the id of one of them.\n- **A dead `redact_events` job leaves the old key on the events** until the nightly run picks the conversation up past its retention period (7 days by default). Its tombstone then records reason `expired` with the conversation id. The `dead` job and its `last_error` are visible in `jobs` meanwhile, and the conversation row and its content already carry the fresh key and nothing personal.\n- **A removed and re-added allow-list entry is a new customer** (E14, E18). Until E23's soft delete lands, the re-added entry does not see the old entry's open conversation, which stays open until the inactivity close or staff close it, and a first message from the re-added entry opens a second conversation for the code. In the MVP the code's index would have resumed the old one.\n\n## Open Questions\n\nNone.\n\nResolved on 2026-11-14 (option A each time):\n- **Q1, simulator scope:** only the call sites change, passing the entry's id as the key. SPEC-simulator E18–E22 land with its own Phase 2 work (Scope 3, Out of scope). Rejected: building E18–E22 here, or only Khách vãng lai, because SPEC-simulator files them with the widget and the issue requires the MVP simulator to behave as before.\n- **Q2, backfill key for a removed entry:** V58's `uuid5(fixed migration namespace, customer_code)` governs. SPEC-simulator R1's \"fresh uuid\" is amended to match (Scope 1, Scope 14). Rejected: amending V58 to a fresh uuid, which would make the key depend on the order the two backfills run in.\n- **Q3, events' `customer_key` and the tombstone:** step 1 replaces the row's key, and the `redact_events` job copies it onto the events through an extended `redact_conversation_events`. A request-reason tombstone carries no conversation id, and SPEC-platform R4 is amended (Scope 8, Scope 14). Rejected: a redactor connection in `api`, because R4 keeps that pool worker-only; and a second platform function, because it would add a second privileged path to ADR-014's one.\n\nResolved in SPEC-conversations, not reopened here: Q11 (nightly redaction keeps the key), Q12 (key-based history), Q13 (soft delete belongs to SPEC-simulator E23), Q14.\n", "r2": "# Conversations Phase 2: ownership by customer key, customer kind, and host site\n\nStatus: proposed (pending approval)\n\n**Depends on:** none\n\nThis builds the Phase 2 amendment to [SPEC-conversations](SPEC-conversations.md): the two \"Amended 2026-11-12\" notes at the top, V47–V62, R1, R7, R15, R16, R17, R19, Success Criteria 15 (as V51 amends it) and 20–24, and Q11–Q14 (all resolved there). Its backing is [ADR-036](../decisions/ADR-036-optional-customer-identity.md), [ADR-037](../decisions/ADR-037-host-sites-in-the-console.md), [SPEC-customer-auth](SPEC-customer-auth.md) R4 and R9, [SPEC-widget](SPEC-widget.md) W7–W13 and its Contracts, and [SPEC-settings](SPEC-settings.md) C31 and C32. This page lists only what this issue builds and how it is accepted; the rules themselves stay in those specs.\n\nLanes: **new feature** plus a **security path**. A conversation is found only by its owner's key, and widget routes may return only `customer_view` models. `security-and-hardening` applies at Plan and Review. Offer `/doubt-driven-development` before Build.\n\nAlready built: `settings.get_host_site` and `settings.list_host_sites` (`src/tivacare/settings/`), and `customer_auth.forget_principals` with the principal key (`src/tivacare/customer_auth/repository.py`, #77).\n\n## Objective\n\nA conversation is owned by an opaque `customer_key` and has a `customer_kind` (`customer_user | anonymous`). `customer_code` stays only as the nullable injected snapshot and CRM key. Every customer-side read and write finds a conversation by key and channel. A visitor's open widget conversation can move to the customer user they sign in as. A deletion request by conversation id removes every trace of the key. Widget conversations record the host site they started from, and staff reads show its current name. The MVP simulator keeps behaving as it does today, apart from the unread rule V51 changes for it on purpose.\n\n## Scope\n\n1. **Tables and migration (R1, V47–V49, V52, V58, V59, V62).** Add one forward-only migration, `0018`, that follows R1's order so an index guards the one-open rule at every step:\n   - It adds `customer_key`, `customer_kind`, `customer_seen_closed_at` and `host_site_id` to `conversations`.\n   - It makes `customer_code` and `customer_name` nullable at insert.\n   - It backfills every `simulator` row as R1 step 2 and V58 say, with `customer_kind = 'customer_user'`. The code comes from the conversation's `simulator_conversations` row, never from `conversations.customer_code`, because redaction (expired or requested) nulls that column and leaves `simulator_conversations` alone (SPEC-simulator R1). The key is the `simulator_customers.id` with that code. For a code no longer on the allow-list, the key is `uuid5(fixed migration namespace, that code)`, with the namespace a constant written in the migration. Already-redacted rows, of either reason, are keyed the same way (see Risks). A `simulator` conversation with no `simulator_conversations` row gets no key, so the `NOT NULL` step fails the migration rather than inventing one. The migration fails if any `tivacloud` row exists.\n   - It applies the checks: `anonymous` ⇒ `customer_code` null, `simulator` ⇒ `host_site_id` null, and `widget` ⇒ `host_site_id` not null. It also adds the FK to `host_sites`.\n   - It moves the partial unique index to (`customer_key`, `channel`) where `state <> 'closed'`.\n   - It keys `conversation_recaps` by `customer_key`, backfilled from each recap's conversation, and drops its code column.\n   - It renames the stored `tivacloud` values to `widget` and swaps the channel check (V49).\n2. **Ownership by key (V47, V48, R7).**\n   - Every customer-side function in `conversations` takes `customer_key` and `channel`. A match on the code alone, or in another channel, is `not_found`. This covers `start_or_resume`, the customer view, posting, read marks, CSAT and holding reads.\n   - `start_or_resume` takes the R7 signature: `customer_key`, `customer_kind`, `customer_code`, `channel`, `host_site_id` and `customer_name`.\n   - `open_conversation_ids(conn, *, channel, customer_keys)` returns a dict keyed by key.\n   - `TurnInput` and `ConversationForTurn` carry `customer_key` and `customer_kind`.\n3. **Simulator call sites only (decided 2026-11-14, Q1).**\n   - Every simulator call into `conversations` passes the allow-list entry's `id` as `customer_key`, with kind `customer_user` and the stored code as the `customer_code` snapshot. The entry id is threaded from where the caller already holds the entry, never looked up by code:\n     - `simulator/api_chat.py`: each route passes the `entry_id` that `require_listed` has just accepted, beside the code it returns, to `conversations` and to `holding`.\n     - `simulator/holding.py`: `post_message`, `show_thread`, `require_player`, `_open_id`/`_open_hold` and `holders` take the key (or keys) and use it for `open_conversation_ids`, `start_or_resume`, `post_customer_message` and `get_customer_conversation` (today lines 92–95, 112–113, 142, 159 and 200). `holders` takes the entries' ids and returns a dict keyed by entry id.\n     - `simulator/names.py` (`name_for_new_conversation`): `open_conversation_ids(customer_keys=[entry.id])`.\n     - `simulator/api_customers.py`: the picker passes its entries' ids to `holders` and reads `held_by` by entry id.\n   - `simulator_conversations` keeps its code column, and its own SQL (`_latest`, `_hold_of`, the insert) stays keyed by code. No route, request or response model changes. The MVP simulator behaves as before, apart from V51's unread rule and E18's re-added entry (see Risks).\n   - `conversations` accepts the `anonymous` kind and tests it through its own functions. Khách vãng lai and the rest of SPEC-simulator E18–E22 are out of scope.\n4. **Recaps and rate-limit counts (V50).**\n   - `store_recap` writes only for `customer_user`.\n   - `list_recaps` and the recap rows are keyed by `customer_key`, and the simulator/widget split is kept.\n   - `customer_message_counts(conn, customer_key, *, simulator, now)` counts by key.\n5. **Unread and widget state (V51, V52, R19).**\n   - `customer_unread` counts only the conversation the widget would show, plus the waiting CSAT prompt. This amends V32.\n   - `mark_customer_read` and `submit_csat` set `customer_seen_closed_at` under V52's condition.\n   - `get_widget_state(conn, *, customer_key, channel, mode, display_name) → WidgetState` is new, and `WidgetState` lives in `customer_view.py`.\n6. **Sign-in carry-over (V53).** `transfer_to_customer_user(conn, platform, conversation_id, *, from_key, to_key, customer_code, customer_name)` follows R7:\n   - It runs under the row lock.\n   - The conversation must be open, `widget`, and owned by `from_key`; otherwise the result is `not_found`.\n   - If `to_key` already holds an open widget conversation, it returns `409 customer_has_open_conversation` and moves nothing.\n   - Otherwise it sets the key, kind, code and name, and posts one \"Khách đã đăng nhập\" line from `templates.py`.\n   - It records `conversations.customer_signed_in` and sends `conversation_changed` for both keys.\n   - State, assignee, timers, read positions and `host_site_id` stay unchanged.\n   - Under a race the unique index on (`customer_key`, `channel`) backs up the check (V53). A `unique_violation` on that index, from a concurrent transfer or `start_or_resume` for `to_key`, is mapped to `409 customer_has_open_conversation` with nothing moved, never a `500`.\n7. **Signals (V55).** The `conversation_changed` and `typing` payloads gain `customer_key` and `channel`. The console hub still forwards ids only (R12).\n8. **Deletion requests (V56, R17, R22).**\n   - `DeletionRequest` takes exactly one of `customer_code` and `conversation_id`. Both or neither is `422 validation_error`.\n   - A request by id redacts every conversation that has that conversation's key. An unknown id returns `200` with `redacted_count: 0`.\n     - The selection is every row with the key, redacted or not. A conversation the nightly run already redacted keeps the key (Q11), so it is selected too. Every selected row gets a fresh key in step 1 and a request-reason `redact_events` job, even when `redact_content` has nothing left to blank.\n     - `redacted_count` stays R17's number blanked in step 1, so rows that were already redacted do not count.\n     - A named conversation that is already redacted, by either reason, is still found by its id. The request answers `200` and processes that conversation's current key as above.\n   - A request by code selects by `customer_code` as before (V56: \"by code it works as before\"). It does not expand to other conversations of the matched keys. Forgetting principals and replacing keys apply to the conversations it matched, exactly as for a request by id (see Risks).\n   - The request calls `customer_auth.forget_principals(conn, keys)` inside V26 step 1's transaction, with every distinct key on the matched conversations.\n   - The request serialises with anything that can add a conversation under a matched key. `start_or_resume`, `transfer_to_customer_user` (for both `from_key` and `to_key`) and the deletion request each take a transaction-scoped advisory lock per customer key before they lock any conversation row. When one call needs several keys, it takes them in sorted order. A request by id reads the named conversation's key, takes that key's lock, then re-reads the named row and re-selects the key's conversations under it. If the named row's key changed meanwhile (a carry-over committed first), the request takes the new key's lock as well and repeats with the new key. A request by code takes the locks of the keys it found, then re-selects by code, and repeats if a new key appeared. So a conversation committed under the key before the request is redacted by it, and one started after it commits is a new conversation, as with a code today.\n   - A carry-over racing a request by id for the visitor's conversation (transfer out of the key) has one of two outcomes. If the request commits first, the conversation is closed and redacted, so the transfer finds it closed and returns `not_found`. If the transfer commits first, the request follows the named conversation to `to_key` and redacts every conversation of `to_key` (see Risks). Either way the named conversation ends redacted, never moved and left unredacted.\n   - The order inside step 1's transaction is: lock and select; close the open ones through `effects.close`, so their `conversation_changed` signal still reaches the old key's clients; `forget_principals`; replace each row's key; `redact_content`; record `conversations.deletion_requested`; enqueue the `redact_events` jobs.\n   - Each redacted conversation's `customer_key` is replaced with a fresh random uuid, on the row and on its events (decided, was Open Question 3):\n     - Step 1 replaces the row's key in the route's transaction. The api has no redactor connection.\n     - The worker's `conversations.redact_events` job (R17) then copies the conversation's new key onto its events, through an extension of platform's privileged `redact_conversation_events` path (ADR-014). The job payload carries no key. Events follow within seconds, as the content keys already do.\n     - The extension: `redact_conversation_events` gains an optional set of metric values to overwrite on the payloads it keeps (here, `customer_key`). It replaces a value only on payloads that already carry that key, and never adds the key to a payload without it. An overwrite that changes a value counts as a change, so a request job writes its tombstone even when the payloads were already reduced.\n     - Only a job with reason `request` reads the conversation's current key from its row and passes the overwrite. A job with reason `expired` passes none, so a nightly redaction leaves every event's `customer_key` as it was (Q11). That includes a conversation carried over at sign-in (V53), whose earlier events keep `from_key` while its row holds `to_key`.\n     - The two reasons never share a job. The request keeps R17's dedupe key `redact:<id>`, and the nightly run's job uses its own key, `redact-expired:<id>`. So a request made while that conversation's nightly job is still queued, or waiting for a retry, gets its own request-reason job. That job overwrites the key and writes the request-shaped tombstone whichever of the two runs first. An `expired` job that runs after it reduces nothing more, writes no tombstone, and changes no key.\n     - This overwrite also covers the events step 1 itself writes with the old key, such as `conversations.closed`'s `customer_key` snapshot (V57).\n     - A failed job inherits the queue's handling unchanged (SPEC-platform R3): 5 attempts with backoff, then `dead` with its `last_error`, never dropped silently. The conversation keeps `redacted_at` null until the job succeeds, so the nightly run (V26) re-enqueues it once its `closed_at` is past the retention period. That run is an `expired` one: it finishes the reduction and sets `redacted_at`, but it does not copy the key. An admin repeats the request by the conversation's id, which gives the row another fresh key and a new request job that overwrites the old key on the events (see Risks).\n     - For a request-reason redaction, the privileged path writes its `retention.redacted` tombstone with `conversation_id` null and no code, key or id in its payload. An `expired` redaction behaves as today. SPEC-platform R4 is amended to match, in this issue (Scope 14).\n   - The `conversations.deletion_requested` event and the request's `retention.redacted` tombstones hold no code, key or conversation id (V56). The per-conversation events step 1 writes as today, `conversations.closed` and `conversations.content_redacted`, keep their `conversation_id`. Once the job has run, their `customer_key` is the fresh uuid, and they hold no code.\n   - The nightly expiry redaction keeps the key (Q11).\n9. **Host site (V59–V61).**\n   - `host_site_id` is set once, by `start_or_resume` on create. Carry-over and redaction keep it.\n   - No rule reads `host_site_id`, and no `customer_view` model carries it.\n   - These staff reads carry `host_site_id` and `host_site_name`, using one `list_host_sites` call per query (`get_host_site` for a single conversation): `list_conversations`, `search_conversations`, `get_staff_view`'s header, `report_history` / `iter_report_history`, and both history calls.\n   - Inactive sites keep their name. An unknown id gives a null name, and a simulator conversation gives nulls.\n   - `report_history` and `iter_report_history` gain a `host_site_id=None` filter.\n10. **Events and staff reads (V57, V60, R15, R16).**\n    - `customer_kind`, `customer_key` and `host_site_id` are snapshot metric keys on lifecycle events and `staff_replied`, and they are in `AGENT_TURN_COMMIT_KEYS`. V57 governs where R15's sentence omits `customer_key`.\n    - `inbox` rows and `report_history` rows carry `customer_kind`. T

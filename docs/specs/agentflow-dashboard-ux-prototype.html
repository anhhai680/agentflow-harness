<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentflow dashboard · UX prototype</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #5f6b7a; --line: #dde2e8;
  --accent: #2f6fd6; --ok: #1f8a4c; --bad: #c23b3b; --warn: #b7791f; --wait: #7a4fd0;
  --chip: #eef1f5; --hl: #fff4c2; --add: #e3f5e9; --del: #fbe7e7; --soft: #f0f4fb;
}
:root.dark {
  color-scheme: dark;
  --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #9aa5b4; --line: #2c3340;
  --accent: #6ea0ff; --ok: #4cc584; --bad: #ff7676; --warn: #f0b44c; --wait: #b294ff;
  --chip: #262d39; --hl: #3d3519; --add: #16301f; --del: #3b1e1e; --soft: #1f2633;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, input, textarea { font: inherit; color: inherit; }
button, select { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 2px 6px; }
button[disabled] { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=search], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
code, pre, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
code { background: var(--chip); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .wait { color: var(--wait); } .run { color: var(--accent); }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }

/* prototype bar */
#proto { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 6px 16px; background: repeating-linear-gradient(45deg, var(--hl), var(--hl) 10px, var(--panel) 10px, var(--panel) 20px); border-bottom: 1px solid var(--line); font-size: 12px; }
#proto strong { color: var(--warn); }
#proto .grow { flex: 1; }
#proto label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }

/* header */
header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; margin: 0 6px 0 0; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.pill.live { color: var(--ok); }
.pill.live::before { content: "● "; }
.pill.live.pulse::before { animation: pulse 1s ease-in-out; }
@keyframes pulse { 0% { opacity: .2; } 50% { opacity: 1; } 100% { opacity: .2; } }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { padding: 4px 10px; border-radius: 6px; color: var(--ink); border: 1px solid transparent; }
nav a:hover { text-decoration: none; background: var(--chip); }
nav a[aria-current=page] { background: var(--accent); color: #fff; }
nav a.dim { color: var(--muted); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--wait); color: #fff; font-size: 11px; text-align: center; font-weight: 700; }
nav a[aria-current=page] .count { background: #fff; color: var(--wait); }
#hdr-summary { flex: 1; color: var(--muted); font-size: 12px; text-align: right; }
main { padding: 14px 16px 60px; max-width: 1500px; margin: 0 auto; }

/* generic */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.row-flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--chip); margin: 1px 4px 1px 0; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.wait { color: var(--wait); } .chip.warn { color: var(--warn); } .chip.run { color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--panel); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
table { border-collapse: collapse; width: 100%; background: var(--panel); }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
.note { background: var(--soft); border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
.note b { color: var(--ink); }
.callout { border-left: 3px solid var(--accent); padding: 2px 10px; margin: 6px 0; font-size: 12px; color: var(--muted); }

/* board */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.columns { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--chip); border-radius: 8px; padding: 8px; min-height: 160px; }
.col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 8px; margin-bottom: 8px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card.waiting { border-left-color: var(--wait); }
.card.done { border-left-color: var(--ok); }
.card.backlog { border-left-color: var(--muted); cursor: default; }
.card .t { font-weight: 600; }
.card .s { font-size: 12px; color: var(--muted); }
.needs { margin-top: 6px; font-size: 12px; color: var(--wait); font-weight: 600; }
.needs::before { content: "◆ "; }
.strip { display: flex; gap: 2px; margin: 6px 0 4px; }
.strip span { flex: 1; height: 5px; border-radius: 2px; background: var(--line); }
.strip span.d { background: var(--ok); } .strip span.r { background: var(--accent); } .strip span.w { background: var(--wait); }
.agentline { font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
.agentline::before { content: "●"; color: var(--ok); font-size: 9px; }
.statusbtn { font-size: 11px; padding: 0 6px; margin-top: 4px; }

/* inbox */
.inbox-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .inbox-grid { grid-template-columns: 1fr; } }
.dcard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--wait); border-radius: 8px; margin-bottom: 12px; }
.dcard.sel { outline: 2px solid var(--accent); }
.dcard.decided { border-left-color: var(--ok); opacity: .75; }
.dcard .dh { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px 4px; flex-wrap: wrap; }
.dcard .dh .title { font-size: 15px; font-weight: 650; }
.dcard .db { padding: 2px 14px 12px; }
.dcard .meta { font-size: 12px; color: var(--muted); }
.dcard .what { margin: 6px 0; }
.dcard .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.blast { font-size: 12px; margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: var(--soft); }
.blast b { color: var(--bad); }
.q { border-top: 1px solid var(--line); padding: 8px 0; }
.q .opt { display: flex; gap: 8px; align-items: flex-start; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.q .opt:hover { background: var(--soft); }
.q .opt .why { font-size: 12px; color: var(--muted); }
.rec { font-size: 11px; color: var(--ok); border: 1px solid var(--ok); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
details.cli summary, details.more summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details.cli pre { margin: 6px 0 0; }
pre { background: var(--chip); padding: 8px; border-radius: 6px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0; }

/* run page */
.runhead { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.runhead .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.runhead h2 { font-size: 18px; margin: 0; }
.banner { display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--wait) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--wait) 45%, var(--line)); border-radius: 8px; padding: 8px 12px; margin: 10px 0; flex-wrap: wrap; }
.banner .grow { min-width: 240px; }
.facts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.facts b { color: var(--ink); font-weight: 600; }
.rail { display: flex; align-items: stretch; margin: 12px 0 4px; overflow-x: auto; }
.rail .ph { flex: 1; min-width: 120px; position: relative; padding: 6px 8px 6px 24px; cursor: pointer; border-radius: 6px; }
.rail .ph:hover { background: var(--soft); }
.rail .ph::before { content: ""; position: absolute; left: 6px; top: 11px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); }
.rail .ph.done::before { background: var(--ok); border-color: var(--ok); }
.rail .ph.wait::before { background: var(--wait); border-color: var(--wait); }
.rail .ph.run::before { background: var(--accent); border-color: var(--accent); }
.rail .ph .n { font-weight: 650; }
.rail .ph .d { font-size: 12px; color: var(--muted); }
.rail .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 5px; }
.rail .bar i { display: block; height: 100%; border-radius: 2px; background: var(--ok); }
.rail .ph.wait .bar i { background: var(--wait); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs a { padding: 7px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { text-decoration: none; color: var(--ink); }
.tabs a[aria-current=page] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .c { font-size: 11px; color: var(--muted); margin-left: 4px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .two { grid-template-columns: 1fr; } }
.sticky { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }

/* document viewer */
.doctool { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.doc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; }
.drow { display: grid; grid-template-columns: 46px 16px minmax(0, 1fr); gap: 0 6px; padding: 0 14px 0 0; align-items: start; }
.drow:hover { background: var(--soft); }
.drow.flash { background: var(--hl); transition: background 1.2s; }
.drow .ln { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); text-align: right; padding-top: 4px; cursor: pointer; user-select: none; border: 0; background: none; }
.drow .ln:hover { color: var(--accent); }
.drow .ln:hover::after { content: " +"; }
.drow .dots { padding-top: 5px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; cursor: pointer; }
.dot.high, .dot.critical { background: var(--bad); } .dot.medium { background: var(--warn); } .dot.low, .dot.minor { background: var(--muted); }
.dot.res { background: transparent; border: 2px solid var(--muted); width: 8px; height: 8px; }
.drow .c { min-width: 0; overflow-wrap: anywhere; }
.drow .c p { margin: 3px 0; }
.drow .c h1, .drow .c h2, .drow .c h3, .drow .c h4 { margin: 10px 0 4px; }
.drow .c h1 { font-size: 20px; } .drow .c h2 { font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 3px; } .drow .c h3 { font-size: 15px; } .drow .c h4 { font-size: 14px; }
.drow .c table { width: auto; margin: 4px 0; font-size: 12px; }
.drow .c td, .drow .c th { border: 1px solid var(--line); padding: 3px 6px; position: static; }
.drow .c blockquote { margin: 3px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.li { display: flex; gap: 6px; margin: 2px 0; }
.li .mk { color: var(--muted); min-width: 14px; }
.link { color: var(--accent); border-bottom: 1px dotted var(--accent); }
.cmt { grid-column: 3; margin: 4px 0 8px; padding: 6px 8px; border-radius: 6px; background: var(--hl); font-size: 12px; }
.cmt .who { font-weight: 600; }
.cmt textarea { min-height: 50px; margin: 4px 0; }
.docfoot { position: sticky; bottom: 0; z-index: 3; margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
.find { border-top: 1px solid var(--line); padding: 8px 2px; font-size: 12px; cursor: pointer; }
.find:hover { background: var(--soft); }
.find .hd { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
.find.resolved { opacity: .6; }
.sev { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 0 5px; border-radius: 3px; color: #fff; }
.sev.high, .sev.critical { background: var(--bad); } .sev.medium { background: var(--warn); } .sev.low, .sev.minor { background: var(--muted); }

/* diff */
.diff { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.5 ui-monospace, Menlo, monospace; overflow: hidden; }
.dl { display: grid; grid-template-columns: 40px 40px 16px minmax(0, 1fr); white-space: pre-wrap; overflow-wrap: anywhere; }
.dl span:nth-child(-n+2) { color: var(--muted); text-align: right; padding-right: 6px; user-select: none; }
.dl.add { background: var(--add); } .dl.del { background: var(--del); }
.dl.gap { background: var(--chip); color: var(--muted); display: block; padding: 2px 12px; }

/* plan tasks */
.st { font-size: 12px; white-space: nowrap; }
.taskrow td:first-child { font-weight: 700; color: var(--muted); }
.taskrow.blocked td { background: color-mix(in srgb, var(--bad) 7%, var(--panel)); }
.taskrow.open td { background: var(--soft); }
.taskdetail td { background: var(--bg); padding: 10px 14px; }
.taskdetail .grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.wave td { background: var(--chip); font-size: 12px; color: var(--muted); font-weight: 600; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.stat .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 11px; color: var(--muted); }

/* agents / transcript */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
tr.grp td { background: var(--chip); font-size: 12px; font-weight: 600; color: var(--muted); }
tr.sel td { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.turn { margin: 6px 0; }
.turn.text { background: var(--soft); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
.turn.tool { font-size: 12px; }
.turn.tool summary { display: flex; gap: 6px; align-items: baseline; cursor: pointer; list-style: none; }
.turn.tool summary::-webkit-details-marker { display: none; }
.tname { font-weight: 700; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--chip); }
.tname.Bash { color: var(--warn); } .tname.Edit, .tname.Write { color: var(--ok); } .tname.Read, .tname.Grep, .tname.Glob { color: var(--accent); }
.turn.think { font-size: 12px; color: var(--muted); font-style: italic; }
.tv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; min-width: 0; }
.idle td { color: var(--warn); }

/* activity */
.act { display: grid; grid-template-columns: 92px 22px minmax(0, 1fr); gap: 4px 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
.act .tm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.act .ic { text-align: center; }
.act .k { font-size: 12px; color: var(--muted); }
.act details summary { font-size: 11px; color: var(--muted); cursor: pointer; }
.act.turns { color: var(--muted); font-size: 12px; font-style: italic; }

/* files */
.flist a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--ink); }
.flist a[aria-current=page] { background: var(--accent); color: #fff; }
.flist a:hover { text-decoration: none; background: var(--chip); }
.flist .grp { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 10px 8px 4px; }

/* peek, dialog, toast */
#peek { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -4px 0 18px rgba(0,0,0,.18); padding: 14px 16px; z-index: 8; overflow: auto; }
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: min(640px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.35); }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: 80vw; font-size: 13px; }
#toast.show { opacity: .96; }
#toast code { background: transparent; color: inherit; }
.tour li { margin: 6px 0; }
.annot { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; background: var(--warn); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: middle; cursor: help; }
body.no-annot .annot { display: none; }
</style>
</head>
<body>
<div id="proto">
  <strong>PROTOTYPE</strong>
  <span class="grow">Mock data from run <b>issue-81</b> (real spec, plan, findings, sessions and events), frozen at <b>15 Nov 09:56</b> Asia/Saigon, while Task 9 waited on you. Nothing is sent anywhere.</span>
  <label><input type="checkbox" id="live-toggle"> Simulate live events</label>
  <label><input type="checkbox" id="annot-toggle" checked> Proposal tags</label>
  <button type="button" id="theme">◐ Theme</button>
  <a href="#/tour">Tour ▸</a>
</div>
<header>
  <h1>agentflow</h1>
  <span class="pill">v2.8</span>
  <nav id="nav">
    <a href="#/inbox" data-v="inbox">Inbox<span class="count" id="inbox-count">3</span></a>
    <a href="#/board" data-v="board">Board</a>
    <a href="#/agents" data-v="agents">Agents</a>
    <a href="#/other/workflow" data-v="workflow" class="dim">Workflow</a>
    <a href="#/other/metrics" data-v="metrics" class="dim">Metrics</a>
    <a href="#/other/lessons" data-v="lessons" class="dim">Lessons</a>
    <a href="#/other/settings" data-v="settings" class="dim">Settings</a>
  </nav>
  <span id="hdr-summary"></span>
  <span id="live" class="pill">static</span>
</header>
<main id="main"></main>
<aside id="peek" hidden></aside>

title": "Spec amendments (Scope 14)", "line": 645, "deps": [1, 2], "files": ["M:docs/specs/SPEC-simulator.md", "M:docs/specs/SPEC-platform.md", "M:docs/specs/SPEC-issue-81.md"], "state": {"implement": {"status": "done", "attempts": 1, "model": "claude-sonnet-5-5", "effort": "medium"}, "review": {"status": "done", "attempts": 1, "model": "claude-sonnet-5-5", "effort": "medium"}, "review_findings": 1, "blocking": 0}}], "specLen": 192, "planLen": 679, "finds": [{"key": "define/spec_review", "round": 1, "sev": "high", "file": "docs/specs/SPEC-issue-81.md", "line": 34, "text": "Scope 3 says 'simulator_conversations, holding, the picker and the routes are otherwise unchanged', with only simulator/api_chat.py passing the entry id. The code contradicts this. simulator/holding.py calls open_conversation_ids(customer_codes=...) at lines 92–95 and 112–113, start_or_resume(customer_code=...) at line 159, and get_customer_conversation(customer_code=...) at line 200. simulator/names.py:81–82 calls o"}, {"key": "define/spec_review", "round": 1, "sev": "high", "file": "docs/specs/SPEC-issue-81.md", "line": 22, "text": "The backfill takes the key from 'the simulator_customers.id whose code matches the row's code'. Redacted conversations have customer_code = NULL, because retention.py's _BLANK_CONVERSATION_SQL sets customer_code and customer_name to NULL. Read literally, every already-redacted simulator row matches nothing and falls back to uuid5(namespace, NULL), which fails or yields NULL, so step 3's NOT NULL fails on any database"}, {"key": "define/spec_review", "round": 1, "sev": "high", "file": "docs/specs/SPEC-issue-81.md", "line": 61, "text": "'No event or tombstone written by the request holds a code, key or conversation id' (repeated as acceptance line 118, 'writes no code, key or conversation id into any event or tombstone') cannot be met as written. request_deletion in retention.py closes open conversations through effects.close, which records conversations.closed with the conversation_id and, from Phase 2 (V57), a customer_key snapshot. It then calls "}, {"key": "define/spec_review", "round": 1, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 125, "text": "'The simulator's existing tests pass unchanged, except where V51 changes the unread count' cannot be achieved. The existing simulator tests call the changed signatures directly. tests/integration/simulator/test_chat_api.py calls open_conversation_ids(customer_codes=[CODE]) and end_chat(customer_code=CODE) at lines 246, 258, 272–273 and 298–300, and holding.post_message(customer_code=...) at line 220. test_holding.py "}, {"key": "define/spec_review", "round": 1, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 105, "text": "The transfer race has no test or error mapping. V53 says 'the unique index backs the check up under a race', and SPEC-conversations line 682 requires 'two concurrent calls move one'. Scope 6 and the transfer acceptance (lines 111–112) never require a unique_violation on (customer_key, channel) to map to 409 customer_has_open_conversation instead of a 500. Nor do they require a concurrent test of transfer against tran"}, {"key": "define/spec_review", "round": 1, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 55, "text": "Concurrency in the deletion request is not specified. A request by id selects the key's conversations FOR UPDATE, calls forget_principals, and replaces keys. A start_or_resume from the same principal (the widget, or a simulator player), or a transfer_to_customer_user into that key, can commit a new conversation under the old key after the select, leaving an unredacted conversation tied to a forgotten principal. The s"}, {"key": "define/spec_review", "round": 1, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 58, "text": "Nothing says what happens if the redact_events job fails. Once step 1 commits, the principal is forgotten and the row has a fresh key, while the events keep the old key until the job succeeds. If the job exhausts its retries, events keep the deleted person's key indefinitely and nothing reports it. State the job's retry policy and how a dead job is detected and re-run, such as a check for redacted_at null on request-"}, {"key": "define/spec_review", "round": 1, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 114, "text": "The deletion acceptance covers only a request by conversation id. The spec makes forget_principals and the key replacement apply to every request, but no test covers a request by customer_code: that it forgets the keys of the matched conversations, replaces each one, and writes no key into the event. A by-code request selects conversations by customer_code, so it leaves that key's code-less conversations (a customer "}, {"key": "define/spec_review", "round": 1, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 67, "text": "'An unknown id gives a null name' (also SC23, line 122) cannot be reached through normal paths. V62's FK from host_site_id to host_sites holds, and host sites are never deleted (settings has no delete), so a test needs to drop the FK or stub list_host_sites. Say how it is tested, or treat it as defensive and drop it from the acceptance."}, {"key": "define/spec_review", "round": 1, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 5, "text": "'Depends on: none', yet line 11 relies on #77 (customer_auth.forget_principals) and #87 (settings host_sites). Both are already merged, so nothing blocks, but name them as satisfied dependencies, not none."}, {"key": "define/spec_review", "round": 1, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 28, "text": "'...read marks, CSAT and holding reads' is vague: conversations has no holding reads, which live in simulator. The list also leaves out end_chat, react, customer_unread, get_widget_state and open_conversation_ids, though 'every customer-side function' covers them. Replace it with the exact function list from SPEC-conversations R7, lines 298–309."}, {"key": "define/spec_review", "round": 1, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 34, "text": "Re-added allow-list entries are not covered. A removed and re-added entry gets a new simulator_customers.id, so a conversation left open under the old entry id (test_removed_code_keeps_conversation_open shows such conversations stay open) has a key the new entry never presents. The player then gets a second open conversation for the same code, and the old one is reachable only through the inbox. Before Phase 2 the co"}, {"key": "define/spec_review", "round": 1, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 142, "text": "The spec marks Q1–Q3 'Resolved on 2026-11-14 (option A each time)', but the workspace has no questions.md recording the options or who chose them, so the resolutions cannot be traced. Add a short line saying who decided each, or link the record, so a human approving the spec can check it."}, {"key": "define/spec_review", "round": 2, "sev": "high", "file": "docs/specs/SPEC-issue-81.md", "line": 67, "text": "The redact-events job 'reads the conversation's current key from its row and passes it in, whatever the reason', and the spec claims that for a nightly redaction 'nothing changes (Q11)'. That is false for a conversation carried over by V53 (transfer_to_customer_user). The row then holds to_key, while the events snapshotted before sign-in hold from_key and customer_kind=anonymous (V57 snapshot keys). A nightly 'expire"}, {"key": "define/spec_review", "round": 2, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 70, "text": "The tombstone rules (a request tombstone has a null conversation_id and holds no code, key or id) depend on the request's job running with reason=request. But _enqueue_redact_events (src/tivacare/conversations/retention.py:147) dedupes on dedupe_key 'redact:<conversation_id>', and platform/queue.py:147-169 uses ON CONFLICT (dedupe_key) WHERE state='queued' DO NOTHING. So a deletion request made while that conversatio"}, {"key": "define/spec_review", "round": 2, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 62, "text": "A request by conversation id redacts 'every conversation with that conversation's key', but the spec doesn't say whether conversations the nightly job already redacted under that key are included. Those keep the key (Q11) on both their row and their events. If they are excluded (today's request_deletion at retention.py:212 selects rows and calls redact_content, which returns False when there is nothing to blank), the"}, {"key": "define/spec_review", "round": 2, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 62, "text": "Scope 8 has transfer_to_customer_user take the advisory lock on to_key only. A deletion by id of a visitor's open conversation (key = from_key) that races a sign-in carry-over goes like this: the deletion locks from_key and selects rows WHERE customer_key = from_key FOR UPDATE, and blocks on the row lock the transfer holds. When the transfer commits, READ COMMITTED re-checks the predicate, finds customer_key = to_key"}, {"key": "define/spec_review", "round": 2, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 62, "text": "The transaction-scoped advisory locks per customer_key don't say how a uuid becomes the lock id: pg_advisory_xact_lock(bigint), or the two-int4 form with a namespace? Nor do they say how this key space is kept apart from any other advisory-lock users (the queue, or the simulator's per-entry serialisation). A hash collision only costs false serialisation, but the mapping and namespace should be fixed in one helper and"}, {"key": "define/spec_review", "round": 2, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 38, "text": "Simulator call sites pass 'the entry id as key', but api_chat routes take entry_id as a str path param, and holding/names functions take str (names.py:72, allow_list.py:43 require_listed(conn, entry_id: str)). customer_key is a uuid. Say that the key is the UUID parsed by require_listed (its _parse_id), not the raw path string, so that one entry can't map to two keys through case or format variants, and an unparsable"}, {"key": "define/spec_review", "round": 3, "sev": "high", "file": "docs/specs/SPEC-issue-81.md", "line": 138, "text": "This acceptance contradicts itself. Line 65 says a call that commits after the deletion request 'is a new conversation', and line 138 allows a start_or_resume that 'commits after it as a new conversation'. But that call runs under the OLD key K: the caller resolved K before the deletion committed. For a visitor, customer_auth/sessions.py verify_visitor_session_with_expiry checks visitor_exists(K) without a lock and i"}, {"key": "define/spec_review", "round": 3, "sev": "medium", "file": "docs/specs/SPEC-issue-81.md", "line": 65, "text": "The repeat loop breaks the lock discipline the same bullet sets ('advisory lock per customer key before they lock any conversation row ... in sorted order'). (1) By id: the request holds lock(K_old) and has re-read, and so row-locked, the named row. It then sees the key changed to K_new and 'takes the new key's lock as well'. That lock is taken after a conversation-row lock, and not in sorted order when K_new < K_old"}, {"key": "define/spec_review", "round": 3, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 21, "text": "'It makes customer_code and customer_name nullable at insert' describes a migration step that does nothing. Both columns are already nullable in migrations/versions/0007_conversations.py (lines 75–76): redaction nulls them today. The change is to the code paths and models (start_or_resume, TurnInput, ConversationForTurn and the agent's call sites), not to the schema. As written, an implementer may add a no-op ALTER, "}, {"key": "define/spec_review", "round": 3, "sev": "low", "file": "docs/specs/SPEC-issue-81.md", "line": 117, "text": "The backfill acceptance does not cover a code that was removed from the allow-list and re-added before the migration ran. simulator_customers.customer_code is UNIQUE (0009), so the re-added entry has a new id, and Scope 1 (line 22) keys the old conversations with that new entry's id ('the simulator_customers.id with that code'). That makes the earlier entry's history the new entry's own, which E14/V47's intent ('old "}, {"key": "plan/plan_review", "round": 1, "sev": "high", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 408, "text": "Task 15 changes customer_unread (reads.py:67, re-exported by customer.py) to take customer_key, but its Files leave out src/tivacare/simulator/api_chat.py. Line 60 of that file calls `customer_unread(conn, customer_code=code, channel=Channel.SIMULATOR)`. Task 12 owns the simulator call sites, but it depends only on Task 8 and runs before Task 15 changes this signature, so no task updates this caller. Task 15 Step 4's"}, {"key": "plan/plan_review", "round": 1, "sev": "high", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 434, "text": "Task 16 asserts that conversation_changed is sent for both keys (V53), but conversation_changed only gets its customer_key payload in Task 17, and Task 16 does not depend on Task 17. Task 16 therefore uses a symbol a later task adds. Separately, today's outbox.conversation_changed(conn, platform, conversation_id) (outbox.py:17) takes only an id. Once the row holds to_key, it cannot signal from_key, and no task adds a"}, {"key": "plan/plan_review", "round": 1, "sev": "medium", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 92, "text": "Task 2 Step 1's migration tests leave out a spec acceptance criterion: a simulator conversation redacted before the migration (customer_code already null by _BLANK_CONVERSATION_SQL at retention.py:57-65, with reason expired and again with reason request) must get the key from its simulator_conversations code, and SET NOT NULL on customer_key must still pass. Without this case, a database holding redacted rows can fai"}, {"key": "plan/plan_review", "round": 1, "sev": "medium", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 502, "text": "Task 18 Steps 2-3 have no tests for several of the spec's deletion acceptance criteria:\n(a) a transfer into the key racing a deletion request;\n(b) a nightly redaction of a carried-over conversation keeps from_key and adds no key;\n(c) a request by code leaves alone a conversation with the same key but without that code;\n(d) a request whose named conversation was already redacted (reason expired, and again reason reque"}, {"key": "plan/plan_review", "round": 1, "sev": "medium", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 15, "text": "The lock-order decision adds `409 retry_later` after 3 passes. The spec does not define this error: R17 and V56 answer 200 with redacted_count, and SPEC-conversations' error table has no retry_later. Task 18's Files also leave out conversations/errors.py and the error table. The fallback (retaking key locks while still holding earlier ones) can also take a lower key after a higher one, which breaks the sorted order t"}, {"key": "plan/plan_review", "round": 1, "sev": "medium", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 249, "text": "Task 8 Step 1 (the ownership tests on a security path) has no test for SC 20 / SPEC-conversations' Phase 2 test row: 'two keys sharing one code can each hold an open conversation'. That case is what proves the unique index moved from customer_code to (customer_key, channel). Without it, a migration that left the old index in place would still pass the suite."}, {"key": "plan/plan_review", "round": 1, "sev": "low", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 485, "text": "Scope 8 says the close signal in deletion step 1 must still reach the old key's clients. effects.close sends conversation_changed only after the key has been replaced with gen_random_uuid(), so the signal carries the new key unless it is sent before the replacement or with the old key passed explicitly. Task 18 does not depend on Task 17 (the key in the signal payload), and no step tests that the close signal carries"}, {"key": "plan/plan_review", "round": 1, "sev": "low", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 654, "text": "The branch Verification section refers to 'CONSTRAINTS.md's changed-line coverage command' without giving the command, so the builder has to look it up and a wrong invocation could go unnoticed. Write out the exact command, as the other verification lines do."}, {"key": "plan/plan_review", "round": 2, "sev": "high", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 387, "text": "Task 13 Step 4 runs tests that cannot pass yet, and the Build-order note at line 26 is wrong. Task 2 Step 7 (line 113) drops conversation_recaps.customer_code. memory.py store_recap (:184-196, INSERT ... customer_code) and list_recaps (:211, WHERE r.customer_code = %s) keep using that column until Task 14 changes them. Task 13 Step 4 runs tests/integration/agent/test_load_context.py and test_runner.py and expects PAS"}, {"key": "plan/plan_review", "round": 2, "sev": "medium", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 541, "text": "Task 18 Step 6 switches the nightly enqueue to the dedupe key redact-expired:<id>. Line 522 then claims that 'A request made while a nightly job is queued gets its own redact:<id> job'. This does not hold for jobs the nightly run queued before the deploy, which still have dedupe_key redact:<id> and reason expired (retention.py:165 today). queue.py:147 _insert_or_find dedupes among state='queued' jobs and returns the "}, {"key": "plan/plan_review", "round": 2, "sev": "low", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 483, "text": "Task 17's Interfaces says there are '15 existing conversation_changed call sites'. A grep of src/ finds about 16 outbox.conversation_changed calls, plus queries.py:476 notify_conversation_changed and the outbox.typing callers. The callers are unchanged, so nothing breaks. But Task 17 adds customer_key and channel to these payloads, and a sweep of call sites that relies on this count could miss one. State the exact li"}, {"key": "plan/plan_review", "round": 3, "sev": "medium", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 331, "text": "tests/integration/conversations/test_retention.py:156-158 seeds `INSERT INTO conversation_recaps (conversation_id, customer_code, is_simulator, closed_at, text)`. Migration 0018 (Task 2) drops conversation_recaps.customer_code, so this fixture fails with UndefinedColumn once Task 2 lands. Task 11 lists test_retention.py, but Step 1 says only 'Update the calls and the channel rename only'. Step 2 then runs all of test"}, {"key": "plan/plan_review", "round": 3, "sev": "low", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 140, "text": "Task 3 Step 2 says to give 'every raw INSERT INTO conversations in seed.py' the owner columns, but tests/integration/reporting/seed.py has no conversation insert. It only records events, with `channel: str = \"tivacloud\"` defaults at :42/:57/:80/:101/:131. Step 3's literal rename still applies, so seed.py belongs in the Files list, but drop it from Step 2."}, {"key": "plan/plan_review", "round": 3, "sev": "low", "file": "docs/plans/2026-11-14-issue-81-issue-81-conversations-phase-2-own-conve.md", "line": 523, "text": "Task 18's race tests drive the lock loop of a deletion by id only. Spec Scope 8 (SPEC-issue-81.md:65) also gives a request by code a 'repeat if a new key appeared' loop, and no test covers it on its own. Add one to test_deletion_races.py: a conversation is started or resumed for the code between the key read and the advisory locks, and the test asserts it is re-keyed and redacted too."}, {"key": "verify/verify", "round": 1, "sev": "minor", "file": null, "line": null, "text": ""}, {"key": "verify/verify", "round": 1, "sev": "minor", "file": null, "line": null, "text": ""}, {"key": "verify/verify", "round": 1, "sev": "minor", "file": null, "line": null, "text": ""}, {"key": "review/branch_review", "round": 1, "sev": "minor", "file": "src/tivacare/conversations/retention.py", "line": 328, "text": "The `if conv.state is State.CLOSED: continue` branch (a row that closed between the unlocked read and the row lock) and the both-or-neither ValueError at :305 are reported uncovered by py_cov_diff. A race test that closes a row after key locks, or a direct call with both/neither target, would cover them. Verify listed this as not verified although a test could cover it."}, {"key": "review/branch_review", "round": 1, "sev": "minor", "file": "src/tivacare/conversations/retention.py", "line": 276, "text": "A deletion by customer_code selects only rows whose customer_code equals the code. Rows of the same key that carry no code (already redacted by the nightly run, or anonymous rows after a transfer) are not blanked or re-keyed here, although their key is forgotten. This is consistent with the spec's by-code wording, but it is worth stating in the docstring."}, {"key": "review/branch_review", "round": 1, "sev": "minor", "file": "docs/specs/SPEC-issue-81.md", "line": 1, "text": "Open Question Q4 (whether a customer user may have no customer code) is left open while the code refuses a code-less transfer and start. It must be settled as a security-path task before the widget routes ship. It is not a defect in this branch."}], "shas": [{"key"

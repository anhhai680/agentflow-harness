# agentflow's pack for this repository: agentflow working on itself. It starts from the engine's `python` fixture
# pack (agentflow/tests/fixtures/packs/python) with the eval and design lanes dropped.
# Edit behaviour here, not in code. `agentflow validate` checks it.
# A string value that starts with "@" is a reference to another key ("@overlays.security.when_paths").
version: 2
engine: ">=2,<3"               # the engine versions that may run this pack

project:
  base_branch: main            # the base the changed-path conditions compare against (`origin/<base_branch>`)
  fork_from: main              # the branch a run is cut from and its pull request goes to; `finish` brings it in first
  branch: "flow/{lane}/{slug}"
  docs:
    specs: docs
    spec_file: "agentflow-{module}-proposal.md"   # the `harness` module is docs/agentflow-harness-proposal.md
    plans: docs/plans
  commit_trailer: "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"

skills:
  map:                          # the skill `agentflow next` names for each kind of next step
    decide: grilling
    define: spec-driven-development
    design_doc: domain-modeling
    plan: writing-plans
    build: subagent-driven-development
    build_small: executing-plans
    verify: verification-before-completion
    ship: finishing-a-development-branch
    review_feedback: receiving-code-review   # sent with a task review's blocking findings, in the implementer's resumed session

agents:
  claude:
    enabled: true
    command: [claude]
    base_args: [-p, --output-format, stream-json, --verbose]
    # bypassPermissions: allow rules are moot, so an agent never stops on an unlisted command. Still binding:
    # deny and ask rules in .claude/settings*.json (ask = denied headless), the runner's --settings denies
    # (forbidden paths, `gh`), PreToolUse hooks, and the guards. Set acceptEdits for a run held to allow rules.
    permission_mode: bypassPermissions
    models: {plan: opus, build: sonnet, mechanical: haiku, review: sonnet, debug: opus}  # fallback when a phase sets no model
    effort_arg: [--effort, "{effort}"]   # the level is the agent's choice (see `effort:`), never set per step
    max_turns: 80
    prices:                      # USD per 1M tokens; prices a session Claude never reported a cost for (rollover, timeout)
      claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write_5m: 5.00,  cache_write_1h: 8.00}
      claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write_5m: 2.50,  cache_write_1h: 4.00}
      claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write_5m: 0.125, cache_write_1h: 0.20}
      # checked against `claude -p` costUSD on 2026-10-30 (1h cache writes); the 5m write rate is 1.25x input, not probed.
      # Haiku 5.5 costs more above 100K-token prompts. Verify current pricing before changing a figure.
  codex:
    enabled: false
    command: [codex]
    base_args: [exec, --json]
    profile: agentflow          # sandbox/approval policy lives in Codex's own config.toml profile
    models: {plan: gpt-5-codex, build: gpt-5-codex, review: gpt-5-codex}
    effort_arg: [-c, "model_reasoning_effort={effort}"]
    skill_loading: read_file   # the prompt tells it to read .claude/skills/<skill>/SKILL.md

defaults:
  agent: claude
  step_timeout_min: 45
  gate_timeout_min: 90         # each gate command; the engine's full suite takes 25-60 minutes on a laptop
  fix_attempts: 3              # gate failure: the same session is resumed with the gate output
  run_budget_usd: 25           # stop + checkpoint when the run's summed cost crosses it
  task_budget_usd: 1.0         # a feature run's budget grows to spend + this x unticked tasks + 25% of run_budget_usd
  env:                         # for every agent session and gate of a run; values are strings
    FORCE_PROMPT_CACHING_5M: "1"   # 5-minute cache writes cost 37.5% less than the 1-hour default; sessions rarely idle

recovery:                       # a usage limit just waits for its reset; these bound everything else
  give_up_h: 24                 # an outage longer than this stops for a human
  failed_attempts: 3            # calls that reached the model and still died: that costs money, an outage does not

effort:
  default: medium               # every step's sizing session starts here
  allowed: [low, medium, high]  # the only levels an agent may pick; resumes reuse the step's level

context:
  autocompact_pct: 60            # Claude Code auto-compact override on every `claude -p`
  autocompact_env: CLAUDE_AUTOCOMPACT_PCT_OVERRIDE
  rollover_pct: 80               # runner safety net
  max_rollovers: 2               # then HITL: split the task
  context_window_tokens: auto    # from stream-json model info; set a number to override
  default_window_tokens: 1000000 # used until a result event reports the model's window
  progress_file: "runs/{run}/progress.md"
  gate_output_lines: 200

gates_confirmed: true         # a human has checked `gates` and `gate_sets` (the page cannot change this)
gates:                          # names to commands
  engine_tests: {run: "uv run --no-project --with pyyaml --with pytest pytest agentflow/tests --import-mode=prepend -q"}
  portability:  {run: "uv run --no-project --with pyyaml --with pytest pytest agentflow/tests/test_portability.py --import-mode=prepend -q"}
gate_sets:
  setup:  [portability]         # the environment, before an agent needs it
  build:  [portability]
  verify: [engine_tests]

guardrails:
  forbidden_paths:              # any diff here fails the step (an agent may not touch them in a run)
    - .claude/**
    - agentflow/tests/fixtures/explain/**   # the golden files pin `explain`; they never change
  reject_trailers: ["Constraints-Approved-By"]
  user_only_skills: [improve-codebase-architecture, constraint-driven-development,
                     doubt-driven-development, using-git-worktrees, writing-for-agents]

overlays:
  security:
    when_paths: [agentflow/guards.py, agentflow/agents.py, agentflow/config_trust.py, agentflow/safeio.py,
                 agentflow/workspace.py, agentflow/pack.py, agentflow/layers.py, agentflow/detect.py,
                 agentflow/init.py]
    when_keywords: [permission, deny rule, forbidden_paths, bypassPermissions]
    add_skills: {plan: security-and-hardening, review: security-and-hardening}
    review_agent: security-auditor

conditions:                     # evaluated by the runner from files and git, never by a model
  spec_exists:            {check: file_exists, path: "{spec}"}
  spec_has_open_questions:
    check: section_items                      # counts open items in one section
    file: "{spec}"
    section: '^## Open Questions'
    stop_at: ['^\*\*Resolved']                # resolved lists don't count
    none_patterns: ['^(- )?None\b']
    min: 1
    on_unknown: false                         # a proposal with no Open Questions section has none to grill
  spec_is_approved:
    check: status_line
    file: "{spec}"
    approved: '^Status: (approved|accepted)'
    pending: '^Status: proposed'              # a proposal is approved by editing its status line
    on_unknown: ask_human                     # no status line: the human says
  spec_awaits_approval: {not: spec_is_approved, on_unknown: false}  # only a proposal that says "proposed"
  spec_defines_contracts:                     # a public surface: commands, routes, or interfaces other modules call
    check: grep
    file: "{spec}"
    pattern: '\b(GET|POST|PUT|PATCH|DELETE) /|WebSocket|^#{2,3} .*(Contracts this module provides|What other modules get from this one)'
  spec_api_reviewed:                          # the proposal's own review is recorded as "**Resolved (<date>, API review...)**"
    check: grep
    file: "{spec}"
    pattern: '^\*\*Resolved \(\d{4}-\d{2}-\d{2}, API review'
  spec_needs_api_design:                      # api-and-interface-design runs once per proposal, before writing-plans
    all: [spec_defines_contracts, {not: spec_api_reviewed}]
  security_path:
    any:
      - {check: changed_paths, globs: "@overlays.security.when_paths"}
      - {check: grep, file: "{plan}", pattern: "@overlays.security.when_keywords"}
  refine_round:           {check: refine_round}                    # a human rejected this phase
  plan_is_small:          {check: plan_tasks, file: "{plan}", max: 3}      # executing-plans instead of per-task sessions
  plan_exists_unchecked:  {check: plan_unchecked, file: "{plan}"}
  plan_done:                                  # a plan exists and every task is ticked; no plan is not "done"
    all:
      - {check: file_exists, path: "{plan}"}
      - {not: plan_exists_unchecked}
  build_done:             {all: [{check: lane, is: feature}, plan_done]}   # only a feature run has a plan to finish

lanes: [feature, bug]   # kinds of work: a lane selects steps of the workflow below, it is not a workflow

record_step:                    # a spec gap settled during a run (hitl.record_decisions.spec_gap); it files an answer
  {id: record_decision, skill: domain-modeling, role: build, prompt: record_decision.md,
   brief: .claude/skills/domain-modeling/SKILL.md, commit: true, message: "Decide {topic} in the {module} proposal"}

resolve_step:                   # a stop in a `resolve: true` phase, run as <key>/resolve-<n> on opus; see `autonomy.resolve_kinds`
  {id: resolve, skill: systematic-debugging, role: plan, prompt: resolve.md,
   brief: .claude/skills/systematic-debugging/SKILL.md}

autonomy:                       # what the runner does on its own; which phases it applies to is on each phase
  non_blocking_severities: [minor, low, info, nit]   # any other severity, or none, blocks: findings fail closed
  finding_rounds: 2             # refine rounds the runner opens on blocking findings, then the phase goes to a human
  answer_recommended: true      # a `needs_human` whose questions all have a recommended option takes it
  revert_forbidden: 1           # put a forbidden path back and tell the step, this often per step
  resolve_kinds:                # stop kind: resolver sessions per step. Any kind not here stops for a human
    blocked: 2
    blocked_repeat: 2
    step_timeout: 2
    gate_failed: 2
    fix_attempts_exhausted: 2
    red_test_passes: 2
    review_unresolved: 1

ci:                             # the `ci` step in `ship`
  poll_s: 60
  appear_min: 5                 # no checks at all for this long is a stop
  timeout_min: 45               # still pending after this is a stop
  fix_rounds: 3
  rerun_rounds: 1               # a fix session that changes nothing runs the failed jobs again, this often
  sync_rounds: 2                # `finish`: resolver sessions for the target branch's conflicts, and re-syncs if GitHub still reports one

phases:                         # the main workflow, in order; --from/--to on the CLI override the ends
  # needs_approval: every phase says whether a human approves it once it ran. false moves on by itself.
  # resolve: true sends this phase's stops to the resolver before a human hears of them.
  # Each step maps to one skill. `lanes:` limits a step to some lanes; with no tag it runs for all of them.
  # brief: repo files the runner puts in the prompt at `{brief}`. task_briefs: the same for one plan task.
  # role: review is read-only and always a fresh session, also in a refine round
  # blocks_on_findings: true: the step's blocking `findings` hold back a phase with needs_approval: false
  define:                                    # the deciding steps on opus; `apply` files answers a human already gave
    needs_approval: true
    model: {default: opus, build: sonnet}
    steps:
      - id: idea
        lanes: [feature]
        unless: spec_exists
        steps:
          - {id: idea_questions, skill: grilling, role: plan, prompt: idea.md, output: "runs/{run}/questions.md"}
          - {id: idea_answers, type: checkpoint, name: idea_answers, wait_for: answered_file}
      - {id: debug, lanes: [bug], skill: systematic-debugging, role: debug, prompt: debug.md}
      - {id: draft, lanes: [feature], skill: spec-driven-development, role: plan, prompt: spec.md,
         output: "{spec}", unless: spec_exists, commit: true, message: "Draft the {module} proposal"}
      - {id: contracts, lanes: [feature], skill: api-and-interface-design, role: plan, prompt: contracts.md,
         when: spec_needs_api_design, commit: true, message: "Add contracts to the {module} proposal"}
      - id: grill_open_questions
        lanes: [feature]
        when: spec_has_open_questions
        repeat: {until: {not: spec_has_open_questions}, max_rounds: 2}  # then HITL
        steps:
          - {id: grill, skill: grilling, role: plan, prompt: grill_spec_questions.md,
             output: "runs/{run}/questions.md"}
          - {id: answers, type: checkpoint, wait_for: answered_file}
          - {id: apply, skill: domain-modeling, role: build, prompt: spec_apply.md,
             brief: [.claude/skills/domain-modeling/SKILL.md, .claude/skills/domain-modeling/ADR-FORMAT.md],
             commit: true, message: "Resolve open questions in the {module} proposal"}
      - {id: spec_approval, lanes: [feature], gates: [], when: spec_awaits_approval}  # no agent: it only keeps `define`
                                                                     # from being skipped, so its approval is the human's
  plan:                                      # the plan on opus; `record_step` files a human's answer on sonnet
    needs_approval: true
    approval_note: {when: security_path, human_skill: doubt-driven-development}  # a human runs it, never the runner
    model: {default: opus, build: sonnet}
    skip_if: plan_exists_unchecked
    steps:
      - {id: plan, lanes: [feature], skill: writing-plans, role: plan, prompt: plan.md,
         output: "{plan_target}", commit: true, message: "Plan {module}"}
  build:                                     # implementer and per-task reviewer on sonnet
    needs_approval: false
    resolve: true
    model: {default: sonnet, review: sonnet, plan: opus}
    skip_if: build_done
    steps:
      - &setup                                                        # no agent: a failure stops for a human, at no cost
        {id: setup, lanes: [feature, bug], type: gate, gates: setup}
      - id: build
        lanes: [feature]
        foreach: plan_task
        skill: subagent-driven-development   # the runner is the controller; each task's session is one implementer
        role: build
        prompt: task.md
        brief: [.claude/skills/subagent-driven-development/implementer-prompt.md, .claude/skills/test-driven-development/SKILL.md,
                .claude/skills/test-driven-development/writing-good-tests.md]
        task_briefs:
          "dashboard.html": .claude/skills/frontend-ui-engineering/SKILL.md
        gates: build
        fix_loop: true
        review: {skill: requesting-code-review, role: review, prompt: task_review.md,
                 brief: .claude/skills/requesting-code-review/code-reviewer.md}
        commit: per_task                                              # ticks the plan's - [ ] boxes
        batch: {max_tasks: 3, max_files: 3, prompt: task_next.md}     # neighbouring small tasks: one session, one review
        small_plan: {when: plan_is_small, skill: executing-plans, prompt: task_inline.md,
                     brief: &tdd_brief [.claude/skills/test-driven-development/SKILL.md,
                                        .claude/skills/test-driven-development/writing-good-tests.md],
                     shared_session: true, review: false}
      - {id: regression_test, lanes: [bug], skill: test-driven-development, role: build, prompt: regression_test.md,
         brief: *tdd_brief, expect: red}                              # the new test must FAIL
      - {id: fix, lanes: [bug], skill: test-driven-development, role: build, prompt: fix.md, brief: *tdd_brief,
         gates: verify, expect: green, fix_loop: true, commit: true, message: "Fix {slug}"}  # the regression test must PASS too
  verify:
    needs_approval: false
    resolve: true
    model: sonnet
    steps:
      - *setup
      - &plan_fixes                                                   # a refine round: decide what each finding needs
        {id: plan_fixes, lanes: [feature, bug], skill: receiving-code-review, role: plan, model: opus,
         prompt: plan_fixes.md, brief: .claude/skills/receiving-code-review/SKILL.md, when: refine_round}
      - &fix_findings                                                 # then carry that plan out; the runner commits
        {id: fix_findings, lanes: [feature, bug], skill: receiving-code-review, role: build,
         prompt: fix_findings.md, brief: .claude/skills/receiving-code-review/SKILL.md,
         when: refine_round, gates: verify, fix_loop: true, commit: true, message: "Fix findings"}
      - {id: verify, lanes: [feature, bug], skill: verification-before-completion, role: build, prompt: verify.md,
         brief: .claude/skills/verification-before-completion/SKILL.md, blocks_on_findings: true, gates_first: true,
         gates: verify, fix_loop: true, commit: true, message: "Fix issues found in verification"}
  review:                                    # the reviewers and the fix on sonnet, `plan_fixes` on opus
    needs_approval: false
    resolve: true
    model: {default: sonnet, build: sonnet}
    steps:
      - {<<: *setup, lanes: [feature, bug], when: refine_round}  # the fix below runs the verify gates
      - *plan_fixes
      - *fix_findings                        # the reviews are read-only: their findings are fixed here, then re-checked
      - {id: branch_review, lanes: [feature, bug], skill: requesting-code-review, role: review,
         prompt: branch_review.md, brief: .claude/skills/requesting-code-review/code-reviewer.md,
         blocks_on_findings: true}
      - {id: security_review, lanes: [feature, bug], skill: security-and-hardening, when: security_path,
         role: review, prompt: security_review.md, brief: .claude/skills/security-and-hardening/SKILL.md,
         blocks_on_findings: true}
  ship:                                      # `ci` fixes on opus through its own session; stops here are a human's
    needs_approval: false
    steps:
      - id: finish                           # every lane: bring origin/<fork_from> in, then push the run's own branch + gh pr create --draft
        type: finish
        gates: setup                         # the environment, before the merged tree is checked
        sync: {id: sync, skill: systematic-debugging, role: plan, prompt: sync_conflicts.md,
               brief: .claude/skills/systematic-debugging/SKILL.md, gates: verify, fix_loop: true,
               human_paths: ["**/uv.lock"]}   # conflicts here (and in security paths) are a human's
      - id: ci                               # every lane: wait for CI, fix what fails, gh pr ready. Never merges
        type: ci
        gates: setup                         # the environment, before a fix session runs the verify gates
        fix: {id: fix, skill: systematic-debugging, role: plan, prompt: ci_fix.md,
              brief: .claude/skills/systematic-debugging/SKILL.md, gates: verify, fix_loop: true,
              forbid: [".github/workflows/**"], commit: true, message: "Fix CI failures"}

phase_approval:                  # raised after a phase with needs_approval: true, and on findings nothing could fix
  refine_prompt: refine.md       # template for each step of a refine round
  show: [handoff, diff, step_results, skipped_steps, gates, review_findings]

checkpoints:                     # inner checkpoints, inside a phase
  idea_answers:       human      # always: product questions

hitl:
  notify:
    - {type: terminal_bell}
    - {type: macos, title: "agentflow: {run} needs you"}       # osascript display notification
    - {type: webhook, url_env: AGENTFLOW_WEBHOOK_URL, enabled: false}  # Slack/Teams/ntfy later
  remind_after_h: 4
  record_decisions: {spec_gap: record_step, ambiguity: commit_body, review_dispute: commit_body}
  park_independent: true          # honour can_continue_without

dashboard:
  host: 127.0.0.1
  port: 7788
  show_done_days: 0               # days a Done card stays on the Board; 0 keeps every one
  agents: {show_exited_min: 10, idle_warn_min: 5}
  backlog:
    sync_base: true
    lane_labels:                    # the page's words for a lane; a lane left out shows its own name
      feature: Feature
      bug: Bug fix
    new_task:                       # lane: its form fields; a lane left out can't be added from the page
      bug: [issue, task, after]     # no work source: a feature run starts from the CLI (`agentflow run feature --module <id>`)

[project]
name = "agentflow-harness"
version = "0.1.0"
description = "agentflow harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "alembic",
    "sqlalchemy",
    "pydantic-settings",
    "pyjwt[crypto]",
    "pillow",
    "httpx>=0.28.1",
    "langchain>=1.4.8",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "openai>=3.45.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "diff-cover",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tivacare"]

[tool.ruff]
line-length = 100
extend-exclude = ["devtools", "docs", ".claude"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not sandbox and not provider'"
markers = [
    "sandbox: needs MISA_MODE=live and sandbox credentials; never in CI",
    "provider: needs real provider keys; never in CI",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src/tivacare"]
omit = ["migrations/*", "devtools/*"]

# The engine defaults: the bottom layer under every pack (`layers.py`). A pack states only what differs from here;
# `null` in a pack deletes a key. A pack that writes `phases:` with steps writes the whole workflow (`lanes`,
# `phases`, `conditions`, `record_step`, `resolve_step`, `phase_approval`, `checkpoints`, `autonomy`, `ci`, `skills`)
# and none of the workflow below applies to it. No gate and no permission line here: a pack states its own.
# A string value that starts with "@" is a reference to another key, resolved after the layers are merged.

project:
  base_branch: main            # the base the changed-path conditions compare against (`origin/<base_branch>`)
  fork_from: main              # the branch a run is cut from and its pull request goes to
  branch: "flow/{lane}/{slug}"
  skills_dir: .claude/skills   # a repository's own skills; the engine's bundled skills are the fallback
  commit_trailer: ""
  agent_rules: [CLAUDE.md]     # files (relative to the repository root, read from the run's fork commit) a run brief carries as the agent's rules
  docs:
    specs: docs
    plans: docs/plans

gates: {}                      # names to commands: every pack states its own
gate_sets: {}                  # a pack with no non-empty `gate_sets.verify` is refused

guardrails:
  forbidden_paths: []          # `.agentflow/**` is always forbidden, whatever a pack says
  reject_trailers: []
  user_only_skills: []

agents:
  claude:
    command: [claude]
    base_args: [-p, --output-format, stream-json, --verbose]
    models: {plan: sonnet, build: sonnet, mechanical: haiku, review: sonnet, debug: sonnet}  # fallback when a phase sets no model
    effort_arg: [--effort, "{effort}"]   # the runner sizes each step's level (see effort:)
    skill_loading: native
    cache_ttl: 5m                # prompt-cache lifetime of a run's sessions: 5m, 1h or cli (the CLI's own choice)
    lean: true                   # a run's sessions skip the project's MCP servers and user-level state
    user_settings: false         # true: a run's sessions also read your own settings and agents (personal; the user file may set it)
    read_only_roles: [review]    # roles whose sessions may read but not edit or run tests; a step that edits must not use one
    max_turns_by_role: {review: 45, plan: 60, build: 60, debug: 60, mechanical: 15}  # --max-turns per call, by role, in the CLI's API-call unit (the CLI counts assistant API calls: one message with parallel tool calls is one turn); 0 = no cap; a role not named uses `max_turns`
    session_budget_usd: {review: 4, plan: 10, build: 10, debug: 10}  # --max-budget-usd per call, by role, in list-price dollars (also on a subscription); 0 = no cap
    bash_output_chars: 15000     # caps one shell command's output a session reads (BASH_MAX_OUTPUT_LENGTH); 0 leaves it to the environment
    prices:                      # USD per 1M tokens; prices a session Claude never reported a cost for (rollover, timeout)
      claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write_5m: 5.00,  cache_write_1h: 8.00}
      claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write_5m: 2.50,  cache_write_1h: 4.00}
      claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write_5m: 0.125, cache_write_1h: 0.20}
  codex:
    enabled: false
    command: [codex]
    models: {plan: gpt-5-codex, build: gpt-5-codex, review: gpt-5-codex}

defaults:
  agent: claude
  step_timeout_min: 45
  gate_timeout_min: 30
  fix_attempts: 3
  run_budget_usd: 25  # soft: notify once when spend crosses it; the run goes on
  run_budget_hard_usd: 65  # hard: the run stops for a human's approval
  task_budget_usd: 2  # the soft budget grows to fit the plan
  env_inherit:                 # what a run's agents and gates do not inherit from the process that started it
    drop: []                   #   names or globs, such as "*_URL"
    drop_dotenv: [".env"]      #   a variable with the same name and value as a line of these files is dropped

recovery:
  give_up_h: 24
  failed_attempts: 3

preflight:
  enabled: false   # true: check the machine once before a run's first phase (the gates' programs, Docker, `setup`)

parallel:
  max_subagents: 1    # plan tasks one build session builds at once (a wave); 1 = off, at most 6; waves need the claude agent
  serial_paths: []    # globs of paths that never go in a wave (migrations, lockfiles, `package.json`, generated clients)

slots:
  count: 1        # live runs that each get their own {slot} (0 … count-1) in defaults.env and gate commands; 1 = off, at most 16

backlog:
  ignore_specs: []   # with work_source kind backlog: globs, relative to project.docs.specs, of spec files that are not backlog items

queue:
  human_slot: 1   # with slots on, `agentflow queue` leaves this many slots free for a run you start by hand

watchdog:
  no_progress_min: 15   # end a session that writes nothing to its stream this many minutes (0 = off; 15 is a safe start)
  read_only_idle_min: 5   # end a read-only session this quiet with no tool call open (0 = use no_progress_min)

usage:
  governor: "on"   # "on": hold new work near the plan's usage window; "observe": record only; "off": nothing (quote it)
  five_hour_soft: 0.75   # of the 5-hour window (above 0, below five_hour_hard): above it no new run or phase starts
  five_hour_hard: 0.92   # of the 5-hour window (above 0, at most 1): above it no new session starts
  seven_day_soft: 0.85   # of the 7-day window (above 0, at most 1): above it no new run or phase starts
  finish_first: true   # held runs go again closest to `finish` first (false: oldest first)

effort:
  sizing: true    # the runner sizes each step before it starts (false: every step runs at default)
  default: medium
  allowed: [low, medium, high]

context:
  autocompact_pct: 60
  autocompact_env: CLAUDE_AUTOCOMPACT_PCT_OVERRIDE
  rollover_pct: 80
  max_rollovers: 2
  context_window_tokens: 200000   # the window the percentages mean; it also caps Claude Code's auto-compact window (the models report 1M)
  max_compactions: 3              # a session that compacted this often is replaced by a fresh one seeded from progress.md
  default_window_tokens: 200000
  progress_file: "runs/{run}/progress.md"
  gate_output_lines: 200
  run_brief: true                 # the stable text of a step (rules, skill, preamble, result contract) goes in a cached system prompt; Claude only
  resume_gate_lines: 80           # gate lines a fix prompt of a resumed session carries, in total (a fresh session still gets the whole report)

memory:
  lessons_max_tokens: 1500   # the most tokens of lessons a step's prompt carries (0 turns lessons off)
  digest_tokens: 15000       # the size a retro's digest of recent runs is cut to
  retro_every_days: 7        # days between the retros the runner proposes (0 means manual only)

issues:
  in_progress_label: "agentflow:in-progress"   # "" turns off the label and the start comment (never the PR link)
  comment: true                                # also post one comment when a run starts from an issue
  epic_labels: ["epic"]                        # an issue with one of these gets `Refs #N`, never `Closes #N`
  sync_label: ""                               # open issues with this label become Backlog cards ("*": every open issue; "" turns the sync off)
  sync_lane: feature                           # the lane of a synced issue that no lane_labels entry matches
  lane_labels: {bug: bug}                      # issue label: lane, for a synced issue; the first match wins

vuln:                          # the vuln lane (patching Dependabot alerts): where alerts come from and what a patch may not touch
  source: dependabot           # dependabot | "" (no alert intake: the lane refuses --alert)
  min_severity: low            # low | medium | high | critical: lower alerts are refused at intake and not synced
  probe: ""                    # the gate whose output must name the advisory before the patch and not after; "" makes `run vuln` refuse to start (the starters set `audit`)
  sync: false                  # true: open alerts become Backlog cards
  dependency_files: ["**/pyproject.toml", "**/uv.lock", "**/requirements*.txt", "**/package.json",
                     "**/pnpm-lock.yaml", "**/package-lock.json", "**/yarn.lock", "**/go.mod", "**/go.sum",
                     "**/Cargo.toml", "**/Cargo.lock", "**/Gemfile", "**/Gemfile.lock"]   # files counted as dependency files; changes outside them are named in the PR (not a boundary)
  forbid: []                   # globs a patch may not touch, added to the engine's fixed list (scanner configs, workflows), never in place of it
  dependency_review: false     # true: before CI marks the PR ready, GitHub's dependency review of the pushed head must name no new advisory at or above min_severity (needs the dependency graph; a 403 or an empty compare stops the run)

policy:                        # what a finished run must show before it counts as conformant; a pack's own entries merge by id
  enforce: report              # report | block (`block` stops `finish` with `conformance_failed` when an obligation is missing)
  obligations:                 # `null` switches an entry off (the engine floor, `gates:verify`, cannot be switched off)
    verified:       {lanes: [feature, bug, vuln], require: ["step:verify"]}
    reviewed:       {lanes: [feature, bug], require: ["step:branch_review"]}
    plan_approved:  {lanes: [feature], require: ["approval:plan"]}
    red_then_green: {lanes: [bug], require: ["expect:red_then_green"]}
    vuln_reviewed:  {lanes: [vuln], require: ["step:vuln_review"]}

hitl:
  park_independent: true       # park a stopped plan task and go on with the tasks that don't depend on it
  park_kinds: [needs_human, blocked, blocked_repeat, gate_failed, fix_attempts_exhausted, review_unresolved,
               guard_violation, step_timeout, turn_cap, budget_cap]   # the stops that park; [] parks nothing
  digest: false                # true: each notification is one machine-wide line ("2 items need you; 3 runs progressing"), sent when it changes

dashboard:
  host: 127.0.0.1
  port: 7788

# ------------------------------------------------------------------------------------------------ the workflow
# In `define` and `plan` (feature lane), a doubt review (`spec_review`, `plan_review`) runs before the human approves.
# Its blocking findings open a reconcile round: only the `reconciles: true` step (`spec_reconcile`, `plan_reconcile`)
# and the review run again. A pack that does not want the review writes its own `phases:` without the four steps
# (it replaces this whole workflow; there is no lighter switch).

skills:
  map:                         # each kind of step's skill; a pack maps its own skills here
    decide: agentflow-define
    define: agentflow-define
    design_doc: agentflow-define
    plan: agentflow-plan
    build: agentflow-build
    build_small: agentflow-build
    build_wave: agentflow-build   # the skill of a session that builds a wave of plan tasks with sub-agents
    debug: agentflow-debug
    patch: agentflow-patch     # the vuln lane's triage and patch sessions
    verify: agentflow-verify
    review: agentflow-review
    review_feedback: agentflow-respond
    doubt: agentflow-doubt     # the adversarial reviewer of a spec and a plan; a pack may map its own, never a user-only skill

conditions:                    # evaluated by the runner from files and git, never by a model
  spec_exists:            {check: file_exists, path: "{spec}"}
  spec_has_open_questions:
    check: section_items
    file: "{spec}"
    section: '^## Open Questions'
    stop_at: ['^(\*\*|#+ )?Resolved\b']   # `**Resolved (...)**`, a plain `Resolved:` or a `### Resolved` heading
    none_patterns: ['^(- )?None\b']
    min: 1
    on_unknown: false
  spec_is_approved:
    check: status_line
    file: "{spec}"
    approved: '^Status: (approved|accepted)'
    pending: '^Status: proposed'
    on_unknown: ask_human
  spec_awaits_approval: {not: spec_is_approved, on_unknown: false}
  refine_round:           {check: refine_round}
  plan_is_small:          {check: plan_tasks, file: "{plan}", max: 3}
  plan_exists_unchecked:  {check: plan_unchecked, file: "{plan}"}
  plan_done:
    all:
      - {check: file_exists, path: "{plan}"}
      - {not: plan_exists_unchecked}
  build_done:             {all: [{check: lane, is: feature}, plan_done]}

lanes: [feature, bug, vuln]   # `vuln` patches a Dependabot alert

record_step:                   # a spec gap settled during a run: it files the answer in the spec
  {id: record_decision, skill: "@skills.map.design_doc", role: build, prompt: record_decision.md, commit: true,
   message: "Decide {topic} in the {module} spec"}

resolve_step:                  # a stop in a `resolve: true` phase, run before a human hears of it
  {id: resolve, skill: "@skills.map.debug", role: plan, prompt: resolve.md}

retro_step:                    # the one session of a retro run (`agentflow retro`): it proposes lessons and changes no file
  {id: retro, skill: agentflow-retro, role: review, prompt: retro.md}

autonomy:
  non_blocking_severities: [minor, low, info, nit]
  finding_rounds: 2
  answer_recommended: true  # in every phase, except kinds in human_question_kinds
  human_question_kinds: [boundary]  # never answered by the runner
  revert_forbidden: 1
  resolve_kinds:
    blocked: 2
    blocked_repeat: 2
    step_timeout: 2
    gate_failed: 2
    fix_attempts_exhausted: 2
    red_test_passes: 2
    review_unresolved: 1
    turn_cap: 1                 # a step that stopped at its turn cap
    budget_cap: 1               # a step that stopped at its spend cap
  speculate: []      # phases that run while the approval of the phase right before them waits (e.g. [plan]); [] = off
  approvals: {}      # phase -> off | observe | auto: the approval ramp; auto also needs ramp_samples agreeing runs and a green scorecard
  ramp_samples: 5    # human decisions in a row that agreed with the runner before `auto` approves by itself; 3 to 50

route:                         # size a run at its start; a profile drops ceremony, never an obligation
  mode: "off"                  # off | observe (decide and record a profile, run the full route) | on (apply it)
  lanes: [feature]             # the lanes whose runs are sized
  profiles:                    # smallest first; a pack that writes `phases:` writes its own `route`
    XS: {skip: [define/grill_open_questions, define/spec_review, plan/plan_review], per_task_review: false}
    S:  {doubt_rounds: {define: 1, plan: 1}, per_task_review: false}
    M:  {doubt_rounds: {define: 2, plan: 1}}
    L:  {wave_review: false}      # each task of a wave keeps its own fresh review session (the full route)

ci:
  poll_s: 60
  appear_min: 5
  timeout_min: 45
  fix_rounds: 3
  rerun_rounds: 1
  sync_rounds: 2
  watch_max_h: 0  # hours to watch checks still pending after timeout_min (a hold, no queue slot); 0 = stop for a human
  early_pr_after: ""  # a phase: push and open the draft PR once it is approved, so CI runs while review does; "" = at finish

phases:
  define:
    needs_approval: true
    model: {default: sonnet, build: sonnet}
    steps:
      - {id: debug, lanes: [bug], skill: "@skills.map.debug", role: debug, prompt: debug.md}
      - {id: triage, lanes: [vuln], skill: "@skills.map.patch", role: plan, prompt: vuln_triage.md,
         output: "runs/{run}/triage.md"}
      - {id: draft, lanes: [feature], skill: "@skills.map.define", role: plan, prompt: spec.md,
         output: "{spec}", unless: spec_exists, commit: true, message: "Draft the {module} spec"}
      - id: grill_open_questions
        lanes: [feature]
        when: spec_has_open_questions
        repeat: {until: {not: spec_has_open_questions}, max_rounds: 2}
        steps:
          - {id: grill, skill: "@skills.map.decide", role: plan, prompt: grill_spec_questions.md,
             output: "runs/{run}/questions.md"}
          - {id: answers, type: checkpoint, wait_for: answered_file}
          - {id: apply, skill: "@skills.map.design_doc", role: build, prompt: spec_apply.md,
             commit: true, message: "Resolve open questions in the {module} spec"}
      - {id: spec_reconcile, lanes: [feature], skill: "@skills.map.design_doc", role: plan, prompt: reconcile.md,
         output: "{spec}", reconciles: true, commit: true, message: "Revise the {module} spec after its review"}
      - {id: spec_review, lanes: [feature], skill: "@skills.map.doubt", role: review, prompt: spec_review.md,
         when: spec_awaits_approval, blocks_on_findings: true}
      - {id: spec_approval, lanes: [feature], gates: [], when: spec_awaits_approval}  # keeps `define` for its approval
  plan:
    needs_approval: true
    model: {default: sonnet, build: sonnet}
    skip_if: plan_exists_unchecked
    steps:
      - {id: plan, lanes: [feature], skill: "@skills.map.plan", role: plan, prompt: plan.md,
         output: "{plan_target}", commit: true, message: "Plan {module}"}
      - {id: plan_reconcile, lanes: [feature], skill: "@skills.map.plan", role: plan, prompt: reconcile.md,
         output: "{plan_target}", reconciles: true, commit: true, message: "Revise the {module} plan after its review"}
      - {id: plan_review, lanes: [feature], skill: "@skills.map.doubt", role: review, prompt: plan_review.md,
         blocks_on_findings: true}
  build:
    needs_approval: false
    resolve: true
    model: {default: sonnet, review: sonnet, plan: sonnet}
    skip_if: build_done
    steps:
      - &setup
        {id: setup, lanes: [feature, bug, vuln], type: gate, gates: setup}
      - id: build
        lanes: [feature]
        foreach: plan_task
        skill: "@skills.map.build"
        role: build
        prompt: task.md
        gates: build
        fix_loop: true
        review: {id: review, skill: "@skills.map.review", role: review, prompt: task_review.md}
        commit: per_task
        batch: {max_tasks: 3, max_files: 3, prompt: task_next.md}
        small_plan: {when: plan_is_small, skill: "@skills.map.build_small", prompt: task_inline.md,
                     shared_session: true, review: false}
      - {id: regression_test, lanes: [bug], skill: "@skills.map.build", role: build, prompt: regression_test.md,
         expect: red}
      - {id: fix, lanes: [bug], skill: "@skills.map.build", role: build, prompt: fix.md,
         gates: verify, expect: green, fix_loop: true, commit: true, message: "Fix {slug}"}
      - {id: advisory_red, lanes: [vuln], type: gate, gates: [], expect: advisory_present}  # the runner runs `vuln.probe`; no agent
      - {id: patch, lanes: [vuln], skill: "@skills.map.patch", role: build, prompt: vuln_patch.md,
         gates: build, expect: advisory_cleared, fix_loop: true, commit: true, message: "Patch {slug}"}
  verify:
    needs_approval: false
    resolve: true
    model: sonnet
    steps:
      - *setup
      - {id: verify, lanes: [feature, bug, vuln], skill: "@skills.map.verify", role: build, prompt: verify.md,
         blocks_on_findings: true, gates_first: true, gates: verify, fix_loop: true, commit: true,
         message: "Fix failures found in verification"}
  review:
    needs_approval: false
    resolve: true
    model: {default: sonnet, build: sonnet}
    steps:
      - {<<: *setup, lanes: [feature, bug, vuln], when: refine_round}
      - &plan_fixes
        {id: plan_fixes, lanes: [feature, bug, vuln], skill: "@skills.map.review_feedback", role: plan, model: opus,
         prompt: plan_fixes.md, when: refine_round}
      - &fix_findings
        {id: fix_findings, lanes: [feature, bug, vuln], skill: "@skills.map.review_feedback", role: build,
         prompt: fix_findings.md, when: refine_round, gates: verify, gate_tier: affected, fix_loop: true,
         commit: true, message: "Fix findings"}
      - {id: branch_review, lanes: [feature, bug], skill: "@skills.map.review", role: review,
         prompt: branch_review.md, blocks_on_findings: true}
      - {id: vuln_review, lanes: [vuln], skill: "@skills.map.review", role: review, prompt: vuln_review.md,
         blocks_on_findings: true}
  ship:
    needs_approval: false
    steps:
      - id: finish
        type: finish
        gates: setup
        sync: {id: sync, skill: "@skills.map.debug", role: plan, prompt: sync_conflicts.md, gates: verify,
               gate_tier: affected, fix_loop: true}
      - id: ci
        type: ci
        gates: setup
        fix: {id: fix, skill: "@skills.map.debug", role: plan, prompt: ci_fix.md, gates: verify, fix_loop: true,
              forbid: [".github/workflows/**"], commit: true, message: "Fix CI failures"}

phase_approval:
  refine_prompt: refine.md
  show: [handoff, diff, step_results, skipped_steps, gates, review_findings]

checkpoints: {}

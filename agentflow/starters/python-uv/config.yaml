# Starter: a Python project built with uv. A config layer under the pack: the pack overrides it key by key.
# It sets only the gates, which gate runs when, and the vuln probe; the workflow, the lanes and every other setting are the engine's.
gates:
  sync: {run: uv sync}
  tests: {run: uv run pytest -q}
  audit:
    run: uv run --frozen --with pip-audit==2.9.0 pip-audit --progress-spinner off --aliases on
    ok_exit: [0]
    found_exit: [1]
gate_sets:
  setup: [sync]
  build: [tests]
  verify: [tests]
# audit is in no gate set, so it slows no other lane; the vuln lane runs it before and after a patch
vuln:
  probe: audit
